<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* page basics (these used to come from the Claude artifact wrapper) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.home-link{display:inline-block;margin-top:4px;color:inherit;opacity:.75;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.home-link:hover{opacity:1}
</style>
<title>Number Knight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: phone = one column (status, equation, room, blade + items, touch controls).
   Computer = room on the left, a sidebar on the right. Single deliberate dungeon-at-night look. */
:root{
  --bg:#10131c;
  --panel:#1a2030;
  --panel2:#222a3e;
  --line:#33405e;
  --ink:#f3f1e8;
  --muted:#a3abc4;
  --gold:#ffcb47;
  --gold-dark:#b8862a;
  --red:#ff5d5d;
  --green:#5fe08a;
  --blue:#6fb6ff;
  --violet:#b58cff;
  --pixel:'Pixelify Sans', 'Courier New', monospace;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(12px, env(safe-area-inset-left, 0px));
  padding-right:max(12px, env(safe-area-inset-right, 0px));
  padding-block:10px;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:100%}
.side{display:contents}
.hud{order:1}.target{order:2}.stage{order:3}.blade{order:4}.items{order:5}.touch{order:6}.keys{order:7}

.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hearts{display:flex;gap:2px;font-size:22px;line-height:1;letter-spacing:-1px}
.hearts .full{color:var(--red)} .hearts .half{color:#ff9a9a} .hearts .empty{color:#3a3f55}
.count{display:flex;align-items:center;gap:4px;font-family:var(--pixel);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.count .ic{font-size:18px}
.star{color:var(--gold)} .arrow{color:#d9c49a}
.stage-name{margin-left:auto;font-family:var(--pixel);font-size:14px;color:var(--muted);text-align:right;line-height:1.1}
#minimap{width:64px;height:44px;display:block}

.target{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px 8px;text-align:center;min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.eq{font-family:var(--pixel);font-size:clamp(28px, 8.5vw, 40px);font-weight:600;line-height:1.1;display:flex;gap:.25em;justify-content:center;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.eq .op{color:var(--muted)}
.eq .blank{display:inline-flex;min-width:1.5em;justify-content:center;border:3px dashed var(--gold);border-radius:8px;color:var(--gold);padding:0 .12em;line-height:1.05}
.eq.match .blank{background:rgba(255,203,71,.16)}
.next{font-size:13px;color:var(--muted);font-family:var(--pixel)}
.timer{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px auto 0;width:min(240px, 70%)}
.obj{font-size:14.5px;line-height:1.35;color:var(--ink);max-width:46ch;margin:4px auto 0;text-wrap:balance}
.timer i{display:block;height:100%;background:var(--gold);width:100%}

.stage{position:relative;width:100%;aspect-ratio:208/176;border-radius:10px;overflow:hidden;background:#000;border:2px solid var(--line)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:14px;text-align:center;background:rgba(10,12,20,.9);overflow-y:auto}
.overlay h1,.overlay h2{font-family:var(--pixel);font-weight:700;margin:0;line-height:1;color:var(--gold);text-wrap:balance}
.overlay h1{font-size:clamp(34px, 10vw, 54px);text-shadow:0 4px 0 #5a3e10}
.overlay h2{font-size:32px}
.overlay p{margin:0;max-width:40ch;line-height:1.4;font-size:14px}
.overlay .small{font-size:12.5px;color:var(--muted)}
.setting{display:flex;flex-direction:column;align-items:center;gap:5px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-weight:700;font-size:14px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 12px;min-height:34px}
.chip .sym{font-family:var(--pixel);font-size:17px;color:var(--gold)}
.chip.num{min-width:40px;justify-content:center;font-family:var(--pixel);font-size:17px}
input:checked + .chip{background:var(--gold);border-color:var(--gold);color:#1a1405}
input:checked + .chip .sym{color:#1a1405}
input:focus-visible + .chip{outline:3px solid var(--green);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--gold)}
.big-btn{font-family:var(--pixel);font-weight:700;font-size:22px;color:#1a1405;background:var(--gold);border:0;border-radius:10px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 var(--gold-dark)}
.big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark)}
.ghost-btn{font-weight:700;font-size:14px;background:none;border:2px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--pixel);font-size:24px}
.howto{display:grid;gap:4px;text-align:left;font-size:13px;max-width:40ch;color:var(--ink);margin:0;padding:0;list-style:none}
.howto li{display:flex;gap:8px}
.howto b{color:var(--gold);font-family:var(--pixel)}

.keypad{position:absolute;inset:auto 0 0 0;background:rgba(16,19,28,.96);border-top:2px solid var(--line);padding:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keypad .kp-show{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;font-family:var(--pixel);font-size:22px;padding:0 6px}
.keypad button{height:42px;border-radius:8px;border:2px solid var(--line);background:var(--panel2);font-family:var(--pixel);font-size:22px;font-weight:600;cursor:pointer;touch-action:manipulation}
.keypad .ok{background:var(--gold);color:#1a1405;border-color:var(--gold)}

.blade{display:flex;align-items:center;justify-content:center;gap:8px}
.blade .label{writing-mode:horizontal-tb}
.bbtn{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-family:var(--pixel);font-size:30px;font-weight:700;cursor:pointer;touch-action:none;display:flex;align-items:center;justify-content:center}
.bbtn:active,.bbtn.held{background:var(--panel2);border-color:var(--muted)}
.bnum{min-width:92px;height:56px;border-radius:12px;border:3px solid var(--gold);background:linear-gradient(#2b3550,#1a2030);font-family:var(--pixel);font-size:36px;font-weight:700;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-variant-numeric:tabular-nums}
.bnum small{font-size:11px;color:var(--muted);font-family:var(--body);letter-spacing:.08em;text-transform:uppercase}
.bnum.omni{border-color:#fff;box-shadow:0 0 14px var(--gold)}

.items{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.item{position:relative;display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;cursor:pointer;touch-action:manipulation}
.item svg{width:22px;height:22px;flex:none}
.item .n{font-family:var(--pixel);font-size:16px;color:var(--gold)}
.item[disabled]{opacity:.38;cursor:default}
.item .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);border-radius:0 0 0 8px}
.item.on{border-color:var(--gold);box-shadow:0 0 10px rgba(255,203,71,.5)}
.item .key{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.owned{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}

.touch{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding-bottom:4px}
.joy{position:relative;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle, #222a3e 0 55%, #1a2030 56%);border:2px solid var(--line);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#3a4767;border:2px solid #56658c;transition:transform .05s}
.acts{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:8px;align-items:center;justify-items:center}
.act{border-radius:50%;border:2px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px}
.act svg{width:22px;height:22px}
.act.big{width:84px;height:84px;grid-row:1 / 3;grid-column:2;background:var(--red);border-color:#ffa0a0;color:#1b0b0b;font-family:var(--pixel);font-size:18px}
.act.sm{width:58px;height:58px}
.act.held{filter:brightness(1.25);transform:scale(.96)}
.act[disabled]{opacity:.35}
.keys{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.keys kbd{font-family:var(--body);font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink);font-size:11.5px}
@media (hover:hover) and (pointer:fine){ .touch{display:none} }
@media (hover:none),(pointer:coarse){ .keys{display:none} .item .key{display:none} }

/* Computers: room on the left, sidebar on the right */
@media (min-width:900px) and (min-height:560px){
  body{padding-block:16px}
  .app{max-width:1500px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;height:calc(100vh - 32px);min-height:0;align-items:start}
  .stage-wrap{display:flex;align-items:center;justify-content:center;height:100%;min-height:0}
  .stage{height:min(100%, calc((100vw - 400px) * 176 / 208));width:auto;max-width:100%}
  .side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;height:100%}
  .hud{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
  .eq{font-size:44px}
  .target{min-height:110px}
  .items{justify-content:flex-start}
  .item{flex:1 1 100%;justify-content:flex-start;height:46px;font-size:14px}
  .item .key{margin-left:auto}
  .overlay h1{font-size:64px}
  .overlay p{font-size:16px}
}
.stage-wrap{order:3;display:contents}
@media (min-width:900px) and (min-height:560px){ .stage-wrap{display:flex;order:0;grid-column:1;grid-row:1} .side{order:1;grid-column:2;grid-row:1} }
@media (max-width:899px), (max-height:559px){ .overlay{position:fixed;z-index:20;background:rgba(10,12,20,.97)} }
.mini{font-family:var(--body);font-weight:700;font-size:12px;background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--ink)}
.tip{position:fixed;z-index:40;left:0;top:0;max-width:min(290px, calc(100vw - 16px));background:var(--gold);color:#1a1405;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:none;animation:tipbob 1.2s ease-in-out infinite}
.tip::after{content:"";position:absolute;left:calc(var(--ax, 50%) - 8px);border:8px solid transparent}
.tip.above::after{top:100%;border-top-color:var(--gold)}
.tip.below::after{bottom:100%;border-bottom-color:var(--gold)}
.tip.inside::after{display:none}
.tip kbd{display:inline-block;background:#1a1405;color:var(--gold);border-radius:5px;padding:0 6px;margin:0 1px;font-family:var(--pixel);font-size:13px;line-height:1.4}
@keyframes tipbob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){ .big-btn:active{transform:none} .tip{animation:none} }
</style>
</head>
<body>

<div class="app">
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="game" aria-label="Dungeon room"></canvas>

      <div class="overlay" id="titleScreen">
        <h1>Number Knight</h1>
        <p>Every monster carries an equation with a missing number. Set your blade to that number, then strike! New quests start with a quick tutorial.</p>
        <div class="setting" role="radiogroup" aria-labelledby="opL">
          <span class="label" id="opL">Math</span>
          <div class="chips">
            <input class="sr" type="radio" name="op" id="op-add" value="add"><label class="chip" for="op-add"><span class="sym">+</span>Add</label>
            <input class="sr" type="radio" name="op" id="op-sub" value="sub"><label class="chip" for="op-sub"><span class="sym">−</span>Subtract</label>
            <input class="sr" type="radio" name="op" id="op-mul" value="mul"><label class="chip" for="op-mul"><span class="sym">×</span>Multiply</label>
            <input class="sr" type="radio" name="op" id="op-div" value="div"><label class="chip" for="op-div"><span class="sym">÷</span>Divide</label>
            <input class="sr" type="radio" name="op" id="op-mix" value="mix"><label class="chip" for="op-mix"><span class="sym">?</span>Mix</label>
          </div>
        </div>
        <div class="setting" role="radiogroup" aria-labelledby="lvL">
          <span class="label" id="lvL">Starting level</span>
          <div class="chips">
            <input class="sr" type="radio" name="lv" id="lv-1" value="1"><label class="chip num" for="lv-1">1</label>
            <input class="sr" type="radio" name="lv" id="lv-2" value="2"><label class="chip num" for="lv-2">2</label>
            <input class="sr" type="radio" name="lv" id="lv-3" value="3"><label class="chip num" for="lv-3">3</label>
            <input class="sr" type="radio" name="lv" id="lv-4" value="4"><label class="chip num" for="lv-4">4</label>
            <input class="sr" type="radio" name="lv" id="lv-5" value="5"><label class="chip num" for="lv-5">5</label>
          </div>
          <span class="small" id="lvDesc"></span>
        </div>
        <label class="toggle"><input type="checkbox" id="harder" checked> Math gets harder each stage</label>
        <div class="row">
          <button class="big-btn" id="newBtn">New quest</button>
          <button class="ghost-btn" id="contBtn" hidden>Continue</button>
        </div>
        <button class="ghost-btn" id="skipBtn">Skip the tutorial</button>
      <a class="home-link" href="../../">← All games</a>
      </div>

      <div class="overlay" id="pauseScreen" hidden>
        <h2>Paused</h2>
        <div class="row"><button class="big-btn" id="resumeBtn">Keep going</button><button class="ghost-btn" id="quitBtn">Main menu</button></div>
      </div>

      <div class="overlay" id="msgScreen" hidden>
        <h2 id="msgTitle"></h2>
        <p id="msgText"></p>
        <div class="stats" id="msgStats"></div>
        <div class="row" id="msgBtns"></div>
      </div>

      <div class="keypad" id="keypad" hidden>
        <div class="kp-show"><span class="label">Type a blade number</span><span id="kpVal">0</span></div>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="del" aria-label="Delete">⌫</button>
        <button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="0">0</button><button data-k="ok" class="ok">OK</button>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="hud">
      <div class="hearts" id="hearts" aria-label="Health"></div>
      <div class="count star" title="Stars"><span class="ic">★</span><span id="stars">0</span></div>
      <div class="count arrow" id="arrowCount" title="Arrows" hidden><span class="ic">➶</span><span id="arrows">0</span></div>
      <div class="stage-name"><span id="stageName">Stage 1</span><br><span id="roomName"></span></div>
      <button class="mini" id="musicBtn" aria-pressed="true">♪ Music on</button>
      <button class="mini" id="skipTut" hidden>Skip tutorial</button>
      <canvas id="minimap" aria-label="Map"></canvas>
    </div>

    <div class="target" id="target">
      <span class="label" id="tLabel">Explore the dungeon</span>
      <div class="eq" id="tEq"></div>
      <div class="next" id="tNext"></div>
      <div class="timer" id="tTimer" hidden><i id="tBar"></i></div>
      <div class="obj" id="tObj" hidden></div>
    </div>

    <div class="blade">
      <button class="bbtn" id="minusBtn" aria-label="Blade number down">−</button>
      <button class="bnum" id="bladeBtn" aria-label="Blade number, tap to type"><small>Blade</small><span id="bladeVal">0</span></button>
      <button class="bbtn" id="plusBtn" aria-label="Blade number up">+</button>
    </div>

    <div class="items" id="items">
      <button class="item" id="it-slow" disabled><svg viewBox="0 0 24 24" fill="none" stroke="#6fb6ff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Time slow <span class="n" id="n-slow">0</span><span class="key">Z</span><span class="cd" id="cd-slow"></span></button>
      <button class="item" id="it-omni" disabled><svg viewBox="0 0 24 24" fill="none" stroke="#ffcb47" stroke-width="2.4" stroke-linecap="round"><path d="M5 19L18 6M14 4h6v6M4 16l4 4"/></svg>Omni sword <span class="n" id="n-omni">0</span><span class="key">X</span><span class="cd" id="cd-omni"></span></button>
      <button class="item" id="it-inv" disabled><svg viewBox="0 0 24 24" fill="none" stroke="#b58cff" stroke-width="2.4" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg><span id="invName">Invincible</span> <span class="n" id="n-inv">0</span><span class="key">C</span><span class="cd" id="cd-inv"></span></button>
      <div class="owned" id="owned"></div>
    </div>

    <div class="touch" id="touch">
      <div class="joy" id="joy" aria-label="Move"><i id="joyKnob"></i></div>
      <div class="acts">
        <button class="act sm" id="bowBtn" disabled aria-label="Shoot arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 3c8 3 11 8 11 16M5 3l10 10M15 13l-1 4 4-1"/></svg>Bow</button>
        <button class="act big" id="atkBtn" aria-label="Strike">Strike</button>
        <button class="act sm" id="shieldBtn" disabled aria-label="Hold shield"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3.5v5.5c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V5.5L12 2z"/></svg>Shield</button>
      </div>
    </div>

  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d'), stageEl = $('stage');
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const isPhone = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || innerWidth < 700;

/* ---------- helpers ---------- */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };

/* ---------- math ---------- */
function P(op, a, b, mode){
  const c = op === '+' ? a + b : op === '−' ? a - b : op === '×' ? a * b : a / b;
  const nums = [a, b, c], blank = mode === 'result' ? 2 : rnd(0, 2);
  return {op, nums, blank, answer: nums[blank]};
}
const sw = (a, b) => Math.random() < .5 ? [a, b] : [b, a];
const add = (a, b, m) => { const [x, y] = sw(a, b); return P('+', x, y, m); };
const mul = (a, b, m) => { const [x, y] = sw(a, b); return P('×', x, y, m); };
const div = (d, q, m) => P('÷', d * q, d, m);
const OPS = {
  add: {name:'Addition', levels:[
    ['Sums to 10', () => { const a = rnd(1,9); return add(a, rnd(1,10-a), 'result'); }],
    ['Missing numbers to 10', () => { const a = rnd(1,9); return add(a, rnd(1,10-a), 'any'); }],
    ['Within 20', () => { const a = rnd(2,15); return add(a, rnd(Math.max(1,11-a), 20-a), 'any'); }],
    ['Tens and ones', () => add(rnd(10,40), rnd(2,9), 'any')],
    ['Two-digit numbers', () => { const a = rnd(11,69); return add(a, rnd(11, Math.min(88, 99-a)), 'any'); }],
  ]},
  sub: {name:'Subtraction', levels:[
    ['Take away within 10', () => { const a = rnd(2,10); return P('−', a, rnd(1,a-1), 'result'); }],
    ['Missing numbers to 10', () => { const a = rnd(3,10); return P('−', a, rnd(1,a-1), 'any'); }],
    ['Within 20', () => { const a = rnd(11,20); return P('−', a, rnd(2,a-1), 'any'); }],
    ['Tens and ones', () => P('−', rnd(20,50), rnd(2,9), 'any')],
    ['Two-digit numbers', () => { const a = rnd(30,99); return P('−', a, rnd(11,a-10), 'any'); }],
  ]},
  mul: {name:'Multiplication', levels:[
    ['Times 1, 2, 5 and 10', () => mul(pick([1,2,5,10]), rnd(1,10), 'result')],
    ['Facts up to 5 × 5', () => mul(rnd(1,5), rnd(1,5), 'result')],
    ['Facts up to 10 × 10', () => mul(rnd(2,10), rnd(2,10), 'result')],
    ['Missing factors', () => mul(rnd(2,10), rnd(2,10), 'any')],
    ['Facts up to 12 × 12', () => mul(rnd(2,12), rnd(3,12), 'any')],
  ]},
  div: {name:'Division', levels:[
    ['Divide by 1, 2, 5 and 10', () => div(pick([1,2,5,10]), rnd(1,10), 'result')],
    ['Facts up to 25 ÷ 5', () => div(rnd(2,5), rnd(1,5), 'result')],
    ['Facts up to 100 ÷ 10', () => div(rnd(2,10), rnd(2,10), 'result')],
    ['Missing numbers', () => div(rnd(2,10), rnd(2,10), 'any')],
    ['Facts up to 144 ÷ 12', () => div(rnd(2,12), rnd(2,12), 'any')],
  ]},
};
const OP_KEYS = ['add','sub','mul','div'];
function genProblem(){
  const op = game.op === 'mix' ? pick(OP_KEYS) : game.op;
  return OPS[op].levels[game.lv - 1][1]();
}
function distinctProblems(n){
  const out = [], seen = new Set();
  for (let tries = 0; out.length < n && tries < 80; tries++){
    const p = genProblem();
    if (seen.has(p.answer)) continue;
    seen.add(p.answer); out.push(p);
  }
  while (out.length < n) out.push(genProblem());
  return out;
}
const eqText = p => p.nums.map((v, i) => i === p.blank ? '?' : v).reduce((s, v, i) => i === 0 ? '' + v : i === 1 ? `${s} ${p.op} ${v}` : `${s} = ${v}`, '');
const eqFull = p => `${p.nums[0]} ${p.op} ${p.nums[1]} = ${p.nums[2]}`;

/* ---------- dungeon generation ---------- */
function mkRoom(x, y, type){ return {x, y, type, doors:{N:false, S:false, W:false, E:false}, tiles:null, cleared: type === 'start' || type === 'shop', visited:false, locked:false, chest:null, shop:null}; }
function genDungeon(stageIdx){
  const key = (x, y) => x + ',' + y;
  for (let attempt = 0; attempt < 200; attempt++){
    const rooms = new Map();
    const start = mkRoom(0, 0, 'start'); rooms.set('0,0', start);
    const path = [start], L = 4 + stageIdx;
    let ok = true;
    const freeNeighbors = (r) => Object.entries(DIRV).filter(([d, [dx, dy]]) => {
      const nx = r.x + dx, ny = r.y + dy;
      if (rooms.has(key(nx, ny))) return false;
      let n = 0; for (const [ex, ey] of Object.values(DIRV)) if (rooms.has(key(nx + ex, ny + ey))) n++;
      return n === 1;
    });
    for (let i = 0; i <= L; i++){
      const cur = path[path.length - 1], opts = freeNeighbors(cur);
      if (!opts.length){ ok = false; break; }
      const [d, [dx, dy]] = pick(opts);
      const r = mkRoom(cur.x + dx, cur.y + dy, i === L ? 'boss' : 'fight');
      cur.doors[d] = true; r.doors[OPP[d]] = true;
      rooms.set(key(r.x, r.y), r); path.push(r);
    }
    if (!ok) continue;
    let placed = 0;
    for (const type of ['treasure', 'shop']){
      const cands = shuffle(path.slice(1, -1));
      for (const host of cands){
        const opts = freeNeighbors(host);
        if (!opts.length) continue;
        const [d, [dx, dy]] = pick(opts);
        const r = mkRoom(host.x + dx, host.y + dy, type);
        host.doors[d] = true; r.doors[OPP[d]] = true;
        rooms.set(key(r.x, r.y), r); placed++;
        break;
      }
    }
    if (placed === 2) return {rooms, key};
  }
  throw new Error('dungeon');
}
function buildTiles(r){
  const g = [];
  for (let y = 0; y < RH; y++){ g.push([]); for (let x = 0; x < RW; x++) g[y].push((x === 0 || y === 0 || x === RW-1 || y === RH-1) ? 1 : 0); }
  let tpl = TEMPLATES[0];
  if (r.type === 'fight' || r.type === 'treasure') tpl = pick(TEMPLATES);
  if (r.type === 'boss') tpl = BOSS_T;
  for (let y = 0; y < 9; y++) for (let x = 0; x < 11; x++){
    const c = tpl[y][x];
    g[y + 1][x + 1] = c === 'o' ? 2 : c === '~' ? 3 : 0;
  }
  if (r.type === 'shop'){ for (let x = 3; x <= 9; x++) g[2][x] = 5; }
  if (r.type === 'tut' && r.step === 5){ for (let x = 2; x <= RW - 3; x++) g[4][x] = 3; }
  for (const d of Object.keys(r.doors)) if (r.doors[d]){ const [dx, dy] = DOOR[d]; g[dy][dx] = 4; }
  r.tiles = g;
}

/* ---------- tile queries ---------- */
function tileAt(tx, ty){
  if (tx < 0 || ty < 0 || tx >= RW || ty >= RH) return -1;
  return room.tiles[ty][tx];
}
function solidTile(tx, ty, flying, hero){
  const t = tileAt(tx, ty);
  if (t === -1){
    if (!hero) return true;
    // outside the room: only passable straight through an open door
    if (room.locked) return true;
    for (const d of Object.keys(room.doors)) if (room.doors[d] && !(d === 'N' && room.type === 'tut' && !room.tutDone)){
      const [dx, dy] = DOOR[d];
      if ((d === 'N' && ty < 0 && tx === dx) || (d === 'S' && ty >= RH && tx === dx) || (d === 'W' && tx < 0 && ty === dy) || (d === 'E' && tx >= RW && ty === dy)) return false;
    }
    return true;
  }
  if (t === 1 || t === 5) return true;
  if (t === 4) return room.locked || !hero || (room.type === 'tut' && !room.tutDone && ty === 0);
  if (t === 2) return !flying;
  if (t === 3) return !flying;
  return false;
}
function boxBlocked(x, y, hw, hh, flying, hero){
  const x0 = Math.floor((x - hw) / T), x1 = Math.floor((x + hw - .01) / T);
  const y0 = Math.floor((y - hh) / T), y1 = Math.floor((y + hh - .01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solidTile(tx, ty, flying, hero)) return true;
  return false;
}
function moveEnt(e, dx, dy, flying){
  let hitX = false, hitY = false;
  const hero = e === player;
  if (dx){ if (!boxBlocked(e.x + dx, e.y, e.hw, e.hh, flying, hero)) e.x += dx; else hitX = true; }
  if (dy){ if (!boxBlocked(e.x, e.y + dy, e.hw, e.hh, flying, hero)) e.y += dy; else hitY = true; }
  return hitX || hitY;
}
function freeSpot(minDist){
  for (let i = 0; i < 200; i++){
    const tx = rnd(2, RW - 3), ty = rnd(2, RH - 3);
    if (room.tiles[ty][tx] !== 0) continue;
    const x = tx * T + T/2, y = ty * T + T/2;
    if (player && Math.hypot(x - player.x, y - player.y) < minDist) continue;
    if (monsters.some(m => Math.hypot(m.x - x, m.y - y) < 18)) continue;
    return {x, y};
  }
  return {x: WW/2, y: WH/2};
}

function spawnMonsters(){
  const st = curStage();
  const count = [rnd(2,3), rnd(3,4), rnd(3,5)][game.stage];
  let eqs;
  if (st.eqMode === 'shared') eqs = [genProblem()];
  else if (st.eqMode === 'pairs') eqs = distinctProblems(2);
  else eqs = distinctProblems(count);
  for (let i = 0; i < count; i++){
    const type = pick(st.monsters), d = MDEF[type], at = freeSpot(56);
    monsters.push({type, x: at.x, y: at.y, hw: d.r * .8, hh: d.r * .8, r: d.r, hp: (type === 'knight' && game.stage === 2) ? 2 : d.hp,
      eq: eqs[i % eqs.length], vx: 0, vy: 0, t: rand(0, 3), flash: 0, stun: 0, shootT: rand(2, 4), spawnT: .6});
  }
}
function newEqFor(m){
  // armored monsters need a fresh equation after each hit; keep it different from the others in the room
  const others = new Set(monsters.filter(o => o !== m).map(o => o.eq.answer));
  for (let i = 0; i < 30; i++){ const p = genProblem(); if (!others.has(p.answer)) return p; }
  return genProblem();
}

/* ---------- room entry ---------- */
function enterRoom(r, fromDir){
  room = r;
  if (!r.tiles) buildTiles(r);
  monsters = []; boss = null; shots = []; drops = []; parts = []; texts = [];
  const first = !r.visited;
  r.visited = true;
  if (fromDir){
    const [dx, dy] = DOOR[OPP[fromDir]];
    player.x = dx * T + T/2 + (fromDir === 'E' ? T : fromDir === 'W' ? -T : 0) * 0;
    player.y = dy * T + T/2;
    if (fromDir === 'N'){ player.y = (RH - 1) * T - 2; }
    if (fromDir === 'S'){ player.y = T + 2; }
    if (fromDir === 'W'){ player.x = (RW - 1) * T - 2; }
    if (fromDir === 'E'){ player.x = T + 2; }
  }
  if (!r.cleared){
    if (r.type === 'fight' || r.type === 'treasure') spawnMonsters();
    if (r.type === 'boss') spawnBoss();
  }
  if (r.type === 'shop' && !r.shop) makeShop(r);
  if (r.type === 'tut') tutEnter(r);
  playMusic(game.stage < 0 ? 'training' : (r.type === 'boss' && !r.cleared) ? 'boss' : 'dungeon');
  if (r.type === 'treasure' && r.cleared && r.chest && !r.chest.open) {}
  r.locked = false;
  roomDirty = true;
  if (first && r.type === 'boss') showToast(boss.name + '!', '#ff5d5d', 2.2);
  if (first && r.type === 'shop') showToast('A shop! Walk onto an item, then strike to buy.', '#ffcb47', 3);
  updateRoomName(); drawMinimap(); updateTarget(true);
}
function updateRoomName(){
  if (room.type === 'tut'){ $('roomName').textContent = `Lesson ${room.step + 1} of ${LESSONS.length}`; return; }
  const n = {start:'Entrance', fight:'', treasure:'Treasure room', shop:'Shop', boss:'Boss lair'}[room.type];
  $('roomName').textContent = n;
}
function roomCleared(){
  room.cleared = true; room.locked = false; roomDirty = true;

  if (room.type === 'treasure'){ room.chest = {x: WW/2, y: WH/2, open: false}; showToast('A treasure chest appeared!', '#ffcb47', 2.2); }

  if (id === 'heart'){ player.hp = Math.min(game.maxHp, player.hp + 4); }
  else if (id === 'heart1'){ player.hp = Math.min(game.maxHp, player.hp + 2); }

function bladeMatches(ans){ return player.omniT > 0 || player.blade === ans; }
function hurtPlayer(dmg, fx, fy, kind){
  if (player.inv > 0 || player.invT > 0) return;
  player.hp -= dmg; if (game.stage < 0) player.hp = Math.max(1, player.hp); player.inv = 1.1;
  const a = Math.atan2(player.y - fy, player.x - fx);
  player.kx = Math.cos(a) * 160; player.ky = Math.sin(a) * 160;
  if (kind === 'slime') player.stuck = 1.4;
  sfx.hurt(); shake(.25);
  burst(player.x, player.y, '#ff5d5d', 10);
  updateHud();
  if (player.hp <= 0) die();

  if (game.bow && Math.random() < .25) drops.push({kind:'arrows', x, y, vx: rand(-30, 30), vy: rand(-30, 30), t: 0});
  if (Math.random() < .07) drops.push({kind: pick(game.charm ? ['slow','omni'] : ['slow','omni','inv']), x, y, vx: rand(-30, 30), vy: rand(-30, 30), t: 0});

}
function hitMonster(m, viaArrow){
  if (m.type === 'statue'){ sfx.clang(); sparks(m.x, m.y); floatText(m.x, m.y - 14, 'Solid stone!', '#a3abc4', 8); return false; }
  if (m.arrowOnly && !viaArrow){ sfx.clang(); sparks(m.x, m.y); floatText(m.x, m.y - 18, 'Use your bow for this one', '#ffcb47', 8); return false; }
  if (m.spawnT > 0) return false;
  if (bladeMatches(m.eq.answer)){
    correctHit(m.eq);
    m.hp--;
    if (m.hp <= 0){ if (viaArrow) tut.arrowKill = true; killMonster(m); }
    else { m.eq = newEqFor(m); m.flash = .4; m.stun = .6; floatText(m.x, m.y - 20, 'Armor cracked!', '#ffcb47', 8); updateTarget(true); }
    return true;
  }
  wrongHit(m.x, m.y, m.eq);
  m.flash = .25;
  if (!viaArrow){ const a = Math.atan2(player.y - m.y, player.x - m.x); player.kx = Math.cos(a) * 90; player.ky = Math.sin(a) * 90; }
  return false;
}
function hitBoss(){
  if (!boss || boss.hitCD > 0 || boss.intro > 0) return;
  const eq = bossEq();
  if (bladeMatches(eq.answer)){
    correctHit(eq);
    boss.hp--; boss.hitCD = 1; boss.flash = .6; shake(.3);
    burst(boss.x, boss.y, BDEF[boss.kind].color, 22);
    if (boss.hp <= 0){ bossDefeated(); return; }
    bossEqs();
    if (boss.kind === 'slime' && boss.hp <= 2 && monsters.length < 2){ const at = freeSpot(40); monsters.push({type:'blob', x: boss.x, y: boss.y + 10, hw: 4.8, hh: 4.8, r: 6, hp: 1, eq: newEqFor({}), vx: 0, vy: 0, t: 0, flash: 0, stun: 0, shootT: 9, spawnT: .5}); }
    updateTarget(true);
  } else {
    wrongHit(boss.x, boss.y, eq);
    boss.hitCD = .35;
  }
}
function bossDefeated(){
  if (boss.kind === 'trainer'){ burst(boss.x, boss.y, '#d9b77a', 30); burst(boss.x, boss.y, '#ffffff', 14); boss = null; sfx.win(); tut.trainerDown = true; updateTarget(true); return; }
  burst(boss.x, boss.y, '#ffffff', 40); burst(boss.x, boss.y, BDEF[boss.kind].color, 40);
  dropLoot(boss.x, boss.y, true);
  drops.push({kind:'container', x: boss.x, y: boss.y + 10, vx: 0, vy: 30, t: 0});
  const wasDrake = boss.kind === 'drake';
  boss = null; monsters = []; shots = [];
  sfx.win(); playMusic('dungeon');
  showToast('Boss defeated!', '#ffcb47', 2.5);
  room.portal = {x: WW/2, y: WH/2 + 8};
  if (wasDrake && !game.charm){
    game.charm = true;
    setTimeout(() => showToast("You earned the Hero's Charm! Invincible is now a reusable power.", '#b58cff', 4.5), 1800);
  }
  roomCleared();
}

function swing(){
  if (state !== 'play' || keypadOpen) return;
  if (player.swing > 0 || player.swingCD > 0 || player.shielding) return;
  player.swing = .2; player.swingCD = .32; player.hitSet = new Set();
  sfx.swing();
  // shop purchase or chest
  if (room.type === 'shop' && room.shop){
    for (const it of room.shop){
      if (it.sold || Math.hypot(player.x - it.x, player.y - it.y) > 14) continue;
      if (game.stars >= it.price){ game.stars -= it.price; it.sold = true; grant(it.id); sfx.buy(); showToast('Bought: ' + it.name, '#5fe08a', 1.8); save(); }
      else showToast(`Need ${it.price - game.stars} more ★`, '#ff9a9a', 1.6);
      return;
    }
  }
}
function swordBox(){
  const [dx, dy] = DIRV[player.dir];
  const reach = 13, w = dx ? 15 : 18, h = dx ? 18 : 15;
  return {x: player.x + dx * reach, y: player.y + dy * reach, w, h};
}
function shootArrow(){
  if (state !== 'play' || keypadOpen || !game.bow || player.bowCD > 0 || player.shielding) return;
  if (game.arrows <= 0){ showToast('Out of arrows', '#ff9a9a', 1.2); return; }
  game.arrows--; player.bowCD = .45; updateHud();
  const [dx, dy] = DIRV[player.dir];
  shots.push({kind:'arrow', friendly: true, x: player.x + dx * 8, y: player.y + dy * 8, vx: dx * 190, vy: dy * 190, r: 3, num: player.blade, life: 2});
  sfx.bow();
}
function useItem(id){
  if (state !== 'play') return;
  if (id === 'inv' && game.charm){
    if (player.invCD > 0 || player.invT > 0) return;
    player.invT = 5; player.invCD = 40; sfx.power(); showToast('Invincible!', '#b58cff', 1.2); updateHud(); return;
  }
  if (!game.items[id]) return;
  if (id === 'slow'){ if (player.slowT > 0) return; player.slowT = 8; showToast('Time slowed!', '#6fb6ff', 1.2); }
  if (id === 'omni'){ if (player.omniT > 0) return; player.omniT = 8; showToast('Omni sword: any monster, any number!', '#ffcb47', 1.6); }
  if (id === 'inv'){ if (player.invT > 0) return; player.invT = 6; showToast('Invincible!', '#b58cff', 1.2); }
  game.items[id]--; tut.used[id] = true; sfx.power(); updateHud(); save();
}

/* ---------- projectiles ---------- */
function projNum(){
  // numbers close to an answer on screen, so matching them means switching the blade on purpose
  const base = boss ? bossEq().answer : (monsters.length ? pick(monsters).eq.answer : player.blade);
  let v = base + pick([-3,-2,-1,1,2,3]);
  if (v < 0) v = base + rnd(1, 3);
  return v;
}
function enemyShot(kind, x, y, ang, speed, num){
  shots.push({kind, friendly: false, x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, r: kind === 'spark' ? 3.5 : 5, num: num ?? projNum(), life: 6});
}
function aimAt(x, y){ return Math.atan2(player.y - y, player.x - x); }

/* ---------- effects ---------- */
function burst(x, y, c, n){
  if (reduceMotion) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++){ const a = rand(0, 6.28), s = rand(20, 90); parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.3, .7), max: .7, c, s: rand(1.5, 3)}); }
}
function sparks(x, y){ burst(x, y, '#fff3b0', 6); }
function floatText(x, y, text, color, size){ texts.push({x, y, text, color, size, life: 1.2, max: 1.2}); }
let shakeT = 0;
function shake(t){ if (!reduceMotion) shakeT = Math.max(shakeT, t); }
function showToast(text, color, t){ toast = {text, color, t, max: t}; }

/* ---------- update ---------- */
const keys = {};
const joy = {x: 0, y: 0};
let typed = '', typedT = 0;

function update(dt){
  game.stats.time += dt;
  const ts = (player.slowT > 0 ? .35 : 1) * (keypadOpen ? .3 : 1);
  const edt = dt * ts;           // enemy time
  const pdt = keypadOpen ? dt * .3 : dt;

  // timers
  for (const k of ['inv','swing','swingCD','slowT','omniT','invT','invCD','stuck','bowCD']) player[k] = Math.max(0, player[k] - dt);
  typedT = Math.max(0, typedT - dt);
  if (player.invCD === 0 && game.charm) {}

  // movement
  let mx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0) + joy.x;
  let my = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0) + joy.y;
  const mag = Math.hypot(mx, my);
  if (mag > 1){ mx /= mag; my /= mag; }
  player.shielding = game.shield && (keys.ShiftLeft || keys.ShiftRight || keys.touchShield) && player.swing === 0;
  let sp = 74 * (player.stuck > 0 ? .45 : 1) * (player.shielding ? .5 : 1);
  if (mag > .15){
    if (player.swing === 0) player.dir = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 'E' : 'W') : (my > 0 ? 'S' : 'N');
    moveEnt(player, mx * sp * pdt, my * sp * pdt, false);
    player.step += pdt * 10;
  }
  if (player.kx || player.ky){
    moveEnt(player, player.kx * dt, player.ky * dt, false);
    player.kx *= Math.pow(.002, dt); player.ky *= Math.pow(.002, dt);
    if (Math.abs(player.kx) < 3) player.kx = 0; if (Math.abs(player.ky) < 3) player.ky = 0;
  }

  // lock doors once the hero is inside a room with monsters
  if (!room.cleared && !room.locked && (monsters.length || boss) && player.x > T * 1.6 && player.x < WW - T * 1.6 && player.y > T * 1.6 && player.y < WH - T * 1.6){
    room.locked = true; roomDirty = true; sfx.lock();
  }

  // door transitions
  if (!room.locked){
    let dir = null;
    if (player.y < 3 && room.doors.N) dir = 'N';
    else if (player.y > WH - 3 && room.doors.S) dir = 'S';
    else if (player.x < 3 && room.doors.W) dir = 'W';
    else if (player.x > WW - 3 && room.doors.E) dir = 'E';
    if (dir && fadeDir === 0){
      const [dx, dy] = DIRV[dir];
      const next = dungeon.rooms.get(dungeon.key(room.x + dx, room.y + dy));
      if (next){ fadeDir = 1; pending = () => enterRoom(next, dir); }
    }
  }

  // sword hits
  if (player.swing > 0){
    const b = swordBox();
    for (const m of monsters.slice()){
      if (player.hitSet.has(m)) continue;
      if (Math.abs(m.x - b.x) < b.w/2 + m.r && Math.abs(m.y - b.y) < b.h/2 + m.r){ player.hitSet.add(m); hitMonster(m, false); }
    }
    if (boss && !player.hitSet.has(boss) && Math.abs(boss.x - b.x) < b.w/2 + boss.r && Math.abs(boss.y - b.y) < b.h/2 + boss.r){ player.hitSet.add(boss); hitBoss(); }
    // chest
    if (room.chest && !room.chest.open && Math.abs(room.chest.x - b.x) < 16 && Math.abs(room.chest.y - b.y) < 16) openChest();
  }
  if (room.chest && !room.chest.open && dist(player, room.chest) < 14) openChest();

  // monsters
  for (const m of monsters){
    const d = MDEF[m.type];
    m.t += edt; m.flash = Math.max(0, m.flash - dt); m.stun = Math.max(0, m.stun - edt); m.spawnT = Math.max(0, m.spawnT - dt);
    if (m.spawnT > 0) continue;
    if (m.stun > 0) continue;
    if (m.type === 'dummy') continue;
    if (m.type === 'statue'){
      m.shootFlash = Math.max(0, (m.shootFlash || 0) - edt);
      m.shootT -= edt;
      if (m.shootT <= 0){ m.shootT = m.rate; m.shootFlash = .3; enemyShot(m.shotKind, m.x, m.y + 4, aimAt(m.x, m.y), m.shotSpeed, m.numFn()); sfx.thud(); }
      continue;
    }
    const ax = player.x - m.x, ay = player.y - m.y, ad = Math.hypot(ax, ay) || 1;
    let vx = 0, vy = 0;
    if (m.type === 'blob'){
      const hop = (m.t % 1.3) < .55;
      if (hop){ if (!m.hopDir || (m.t % 1.3) < .03){ const a = Math.atan2(ay, ax) + rand(-.8, .8); m.hopDir = [Math.cos(a), Math.sin(a)]; } vx = m.hopDir[0] * d.speed * 1.5; vy = m.hopDir[1] * d.speed * 1.5; }
    } else if (m.type === 'bat'){
      const a = Math.atan2(ay, ax) + Math.sin(m.t * 2.2) * 1.2;
      vx = Math.cos(a) * d.speed; vy = Math.sin(a) * d.speed;
    } else if (m.type === 'knight'){
      vx = ax / ad * d.speed; vy = ay / ad * d.speed;
    } else if (m.type === 'wisp'){
      const want = ad > 60 ? 1 : ad < 40 ? -1 : 0;
      vx = ax / ad * d.speed * want + Math.cos(m.t) * 12; vy = ay / ad * d.speed * want + Math.sin(m.t * 1.3) * 12;
      m.shootT -= edt;
      if (m.shootT <= 0){ m.shootT = rand(3, 4.5); enemyShot('spark', m.x, m.y, aimAt(m.x, m.y), 55); }
    }
    const ms = game.stage < 0 ? .55 : 1;
    if (moveEnt(m, vx * edt * ms, vy * edt * ms, d.fly) && m.type === 'blob') m.hopDir = null;
    // contact
    if (Math.abs(m.x - player.x) < m.r + 4 && Math.abs(m.y - player.y) < m.r + 4){
      if (player.shielding){ const a = Math.atan2(m.y - player.y, m.x - player.x); m.x += Math.cos(a) * 6; m.y += Math.sin(a) * 6; m.stun = .3; }
      else hurtPlayer(1, m.x, m.y);
    }
  }

  if (boss) updateBoss(edt, dt);

  // shots
  for (let i = shots.length - 1; i >= 0; i--){
    const s = shots[i];
    const k = s.friendly ? dt : edt;
    s.x += s.vx * k; s.y += s.vy * k; s.life -= k;
    const tx = Math.floor(s.x / T), ty = Math.floor(s.y / T), tt = tileAt(tx, ty);
    if (s.life <= 0 || tt === -1 || tt === 1 || (tt === 2 && s.kind === 'arrow')){ if (tt === 1 || tt === 2) burst(s.x, s.y, '#cccccc', 3); shots.splice(i, 1); continue; }
    if (s.friendly){
      let used = false;
      for (const m of monsters){ if (Math.hypot(m.x - s.x, m.y - s.y) < m.r + 3){ hitMonster(m, true); used = true; break; } }
      if (!used && boss && Math.hypot(boss.x - s.x, boss.y - s.y) < boss.r + 3){ hitBoss(); used = true; }
      if (used) shots.splice(i, 1);
    } else if (Math.hypot(player.x - s.x, player.y - s.y) < s.r + 5){
      shots.splice(i, 1);
      if (player.blade === s.num){
        game.stars++; game.stats.starsTotal++; updateHud(); tut.absorbs = (tut.absorbs || 0) + 1;
        floatText(player.x, player.y - 14, 'Soaked up ' + s.num + '! +1★', '#ffcb47', 8); sfx.absorb(); burst(s.x, s.y, '#ffcb47', 8);
      } else if (player.shielding || player.invT > 0){
        if (player.shielding) tut.blocks = (tut.blocks || 0) + 1;
        floatText(player.x, player.y - 14, 'Blocked!', '#6fb6ff', 8); sfx.block(); burst(s.x, s.y, '#6fb6ff', 6);
      } else hurtPlayer(s.kind === 'flame' ? 2 : 1, s.x, s.y, s.kind);
    }
  }

  // drops
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.t += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= Math.pow(.02, dt); d.vy *= Math.pow(.02, dt);
    d.x = clamp(d.x, T + 4, WW - T - 4); d.y = clamp(d.y, T + 4, WH - T - 4);
    const near = Math.hypot(player.x - d.x, player.y - d.y);
    if (d.kind === 'star' && near < 28 && d.t > .3){ d.x += (player.x - d.x) * Math.min(1, dt * 8); d.y += (player.y - d.y) * Math.min(1, dt * 8); }
    if (near < 9 && d.t > .25){
      drops.splice(i, 1);
      if (d.kind === 'star'){ game.stars += d.v; game.stats.starsTotal += d.v; sfx.star(); }
      else if (d.kind === 'heart'){ grant('heart1'); sfx.star(); }
      else if (d.kind === 'arrows'){ grant('arrows5'); sfx.star(); floatText(d.x, d.y - 10, '+5 arrows', '#d9c49a', 8); }
      else if (d.kind === 'container'){ grant('container'); sfx.win(); showToast('Extra heart!', '#ff5d5d', 1.6); }
      else { grant(d.kind); sfx.power(); showToast('Found: ' + ITEM_NAMES[d.kind], '#ffcb47', 1.6); }
      updateHud();
      continue;
    }
    if (d.t > 14 && d.kind !== 'container') drops.splice(i, 1);
  }

  // stage portal
  if (room.portal && dist(player, room.portal) < 10 && fadeDir === 0) stageComplete();

  // particles & text
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; }
  for (let i = texts.length - 1; i >= 0; i--){ const t = texts[i]; t.life -= dt; t.y -= 14 * dt; if (t.life <= 0) texts.splice(i, 1); }
  if (toast){ toast.t -= dt; if (toast.t <= 0) toast = null; }
  shakeT = Math.max(0, shakeT - dt);

  // tips
  tip = null;
  if (room.type === 'start' && game.stage === 0) tip = 'Set your blade to the missing number, then strike. Doors lock until every monster is beaten.';
  else if (room.type === 'start' && game.stage === 1) tip = 'Monsters here can carry different equations. Change your blade for each one.';
  else if (room.type === 'start' && game.stage === 2) tip = 'Every monster has its own equation now. Armored knights need two hits.';
  if (room.type === 'shop' && room.shop) for (const it of room.shop) if (!it.sold && Math.hypot(player.x - it.x, player.y - it.y) < 14) tip = `${it.name}: ${it.price} ★. Strike to buy.`;
  if (room.type === 'tut') tutUpdate(dt); else { tutPoint = null; setTip(null); setObj(''); }
}

function updateBoss(edt, dt){
  const b = boss, d = BDEF[b.kind];
  b.t += edt; b.flash = Math.max(0, b.flash - dt); b.hitCD = Math.max(0, b.hitCD - dt);
  if (b.intro > 0){ b.intro -= dt; return; }
  if (b.period){
    b.cycleT -= edt;
    if (b.cycleT <= 0){ b.idx = (b.idx + 1) % b.eqs.length; b.cycleT = b.period; sfx.cycle(); updateTarget(true); }
  }
  if (b.kind === 'trainer') return;
  b.act -= edt;
  const ang = aimAt(b.x, b.y);
  if (b.kind === 'slime'){
    // hop toward the hero, then spit three numbered slimes
    b.hopT -= edt;
    if (b.hopT <= 0){ b.hopT = 1.8; const a = ang + rand(-.5, .5); b.vx = Math.cos(a) * 70; b.vy = Math.sin(a) * 70; b.hopping = .6; }
    if (b.hopping > 0){ b.hopping -= edt; moveEnt(b, b.vx * edt, b.vy * edt, false); if (b.hopping <= 0){ sfx.thud(); shake(.12); for (const o of [-.35, 0, .35]) enemyShot('slime', b.x, b.y, ang + o, 50); } }
  } else if (b.kind === 'drake'){
    // glide side to side near the top, breathe numbered fireballs
    const tx = WW/2 + Math.sin(b.t * .6) * 60, ty = 64 + Math.sin(b.t * 1.1) * 8;
    moveEnt(b, (tx - b.x) * edt * 1.5, (ty - b.y) * edt * 1.5, true);
    if (b.act <= 0){
      b.phase++;
      if (b.phase % 3 === 0){ for (let i = -2; i <= 2; i++) enemyShot('flame', b.x, b.y + 6, ang + i * .28, 48); b.act = 3.2; }
      else { enemyShot('flame', b.x, b.y + 6, ang, 68); b.act = 1.9; }
      sfx.fire();
    }
  } else if (b.kind === 'lich'){
    // drift, teleport, alternate slime spreads and aimed flames, call wisps
    moveEnt(b, Math.cos(b.t * .7) * 20 * edt, Math.sin(b.t * .9) * 14 * edt, true);
    b.tele = (b.tele ?? 5) - edt;
    if (b.tele <= 0){ b.tele = rand(4.5, 6); const at = freeSpot(70); burst(b.x, b.y, '#b58cff', 18); b.x = at.x; b.y = Math.min(at.y, WH - 50); burst(b.x, b.y, '#b58cff', 18); sfx.warp(); }
    if (b.act <= 0){
      b.phase++;
      if (b.phase % 4 === 0 && monsters.length < 2){ const at = freeSpot(40); monsters.push({type:'wisp', x: at.x, y: at.y, hw: 4, hh: 4, r: 5, hp: 1, eq: newEqFor({}), vx: 0, vy: 0, t: 0, flash: 0, stun: 0, shootT: 3, spawnT: .7}); updateTarget(true); b.act = 2; }
      else if (b.phase % 2){ for (const o of [-.45, -.15, .15, .45]) enemyShot('slime', b.x, b.y, ang + o, 46); b.act = 2.4; sfx.thud(); }
      else { enemyShot('flame', b.x, b.y, ang, 72); setTimeout(() => boss && enemyShot('flame', boss.x, boss.y, aimAt(boss.x, boss.y), 72), 300); b.act = 2.2; sfx.fire(); }
    }
  }
  // contact
  if (Math.abs(b.x - player.x) < b.r + 4 && Math.abs(b.y - player.y) < b.r + 4){
    if (player.shielding){ const a = Math.atan2(player.y - b.y, player.x - b.x); player.kx = Math.cos(a) * 140; player.ky = Math.sin(a) * 140; }
    else hurtPlayer(2, b.x, b.y);
  }
}

function openChest(){
  room.chest.open = true;
  const id = curStage().treasure;
  grant(id); sfx.win();
  const msg = {bow:'You found a Bow and 10 arrows! Arrows carry your blade number.', shield:'You found a Shield! Hold it to block anything.', omni2:'You found 2 Omni swords!'}[id];
  showToast(msg, '#ffcb47', 4);
  burst(room.chest.x, room.chest.y, '#ffcb47', 20);
  save();
}

/* ---------- stage flow ---------- */
function startStage(landing){
  const st = curStage();
  game.lv = game.stage < 0 ? 1 : clamp(game.baseLv + (game.harder ? game.stage : 0), 1, 5);
  dungeon = game.stage < 0 ? genTutorial() : genDungeon(game.stage);
  if (!player) player = newPlayer();
  player.hp = game.maxHp; player.x = WW/2; player.y = WH/2 + 24; player.dir = 'N';
  player.slowT = player.omniT = player.invT = 0; player.inv = 0;
  game.snapshot = JSON.stringify({stars: game.stars, arrows: game.arrows, items: game.items, maxHp: game.maxHp, bow: game.bow, shield: game.shield, charm: game.charm});
  $('stageName').textContent = game.stage < 0 ? 'Training Grounds' : `Stage ${game.stage + 1}: ${st.name}`;
  $('skipTut').hidden = game.stage >= 0;
  enterRoom(dungeon.rooms.get('0,0'), null);
  setBlade(player.blade);
  updateHud();
  if (landing) startCut('landing');
  else showToast(game.stage < 0 ? 'Welcome to the Training Grounds!' : `Stage ${game.stage + 1}: ${st.name}`, '#ffcb47', 2.4);
  save();
}
function stageComplete(){
  state = 'msg';
  const last = game.stage >= STAGES.length - 1;
  const s = game.stats, acc = s.right + s.wrong ? Math.round(100 * s.right / (s.right + s.wrong)) : 100;
  if (last){
    playMusic('flight');
    showMsg('Victory!', `You beat the ${curStage().name} and saved the realm.`, [['Equations solved', s.right], ['Accuracy', acc + '%'], ['Stars found', s.starsTotal]],

let lastTargetKey = '';
function updateTarget(force){
  let eq = null, label = 'Explore the dungeon', next = '', timer = false, pct = 0;
  if (boss){
    eq = bossEq(); label = boss.name + (boss.hp ? `: ${boss.hp} hits left` : '');
    if (boss.period){ timer = true; pct = boss.cycleT / boss.period; next = 'Next: ' + eqText(boss.eqs[(boss.idx + 1) % boss.eqs.length]); }
  } else if (monsters.some(m => m.type !== 'statue')){
    const fighters = monsters.filter(m => m.type !== 'statue');
    let best = null, bd = 1e9;
    for (const m of fighters){ const d = dist(m, player); if (d < bd){ bd = d; best = m; } }
    eq = best.eq;

const mm = $('minimap'), mctx = mm.getContext('2d');
function drawMinimap(){
  if (!dungeon) return;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = 64, h = 44; mm.width = w * d; mm.height = h * d; mctx.setTransform(d, 0, 0, d, 0, 0);
  mctx.clearRect(0, 0, w, h);
  const rooms = [...dungeon.rooms.values()];
  const minX = Math.min(...rooms.map(r => r.x)), maxX = Math.max(...rooms.map(r => r.x));
  const minY = Math.min(...rooms.map(r => r.y)), maxY = Math.max(...rooms.map(r => r.y));
  const cw = Math.min(10, (w - 4) / (maxX - minX + 1)), ch = Math.min(8, (h - 4) / (maxY - minY + 1));
  const ox = (w - cw * (maxX - minX + 1)) / 2, oy = (h - ch * (maxY - minY + 1)) / 2;
  for (const r of rooms){
    const known = r.visited || Object.entries(r.doors).some(([dd, v]) => v && dungeon.rooms.get(dungeon.key(r.x + DIRV[dd][0], r.y + DIRV[dd][1]))?.visited);
    if (!known) continue;
    const x = ox + (r.x - minX) * cw, y = oy + (r.y - minY) * ch;

    if (r.type === 'boss' && !r.visited){ mctx.fillStyle = '#ff5d5d'; mctx.fillRect(x + cw/2 - 1, y + ch/2 - 1, 2, 2); }

}

const txtCache = new Map();
function textImg(text, color, stroke, bold){

  const g = c.getContext('2d'), fs = 48, font = `${bold ? 700 : 600} ${fs}px "Pixelify Sans", "Courier New", monospace`;
  g.font = font;

}
const eqImgCache = new Map();

}

let tipKey = '';
function setTip(html, target){
  const el = $('tip');
  if (!html || state !== 'play'){ if (!el.hidden) el.hidden = true; tipKey = ''; return; }
  let tEl = $(target);
  if (!tEl || !tEl.getClientRects().length){ tEl = stageEl; target = 'stage'; }
  const key = html + '|' + target;
  if (key !== tipKey){ el.innerHTML = html; tipKey = key; }
  el.hidden = false;
  const r = tEl.getBoundingClientRect(), tw = el.offsetWidth, th = el.offsetHeight;
  let top, cls;
  if (target === 'stage'){ top = r.top + 10; cls = 'inside'; }
  else if (target === 'bladeBtn' && r.bottom + th + 18 < innerHeight){ top = r.bottom + 12; cls = 'below'; }
  else if (r.top > th + 18){ top = r.top - th - 12; cls = 'above'; }
  else { top = r.bottom + 12; cls = 'below'; }
  const left = clamp(r.left + r.width / 2 - tw / 2, 8, innerWidth - tw - 8);
  el.className = 'tip ' + cls;
  el.style.transform = '';
  el.style.left = left + 'px'; el.style.top = top + 'px';
  el.style.setProperty('--ax', clamp(r.left + r.width / 2 - left, 14, tw - 14) + 'px');
}

    if (e.code === 'KeyF' && !e.repeat) shootArrow();
    if (e.code === 'KeyQ' || e.code === 'Minus' || e.code === 'NumpadSubtract') setBlade(player.blade - 1);
    if (e.code === 'KeyE' || e.code === 'Equal' || e.code === 'NumpadAdd') setBlade(player.blade + 1);
    if (e.code === 'KeyZ' && !e.repeat) useItem('slow');
    if (e.code === 'KeyX' && !e.repeat) useItem('omni');
    if (e.code === 'KeyC' && !e.repeat) useItem('inv');
    const dig = /^(Digit|Numpad)(\d)$/.exec(e.code);
    if (dig && !e.repeat){
      typed = (typedT > 0 && typed.length < 3 ? typed : '') + dig[2];
      typedT = 1;
      setBlade(parseInt(typed, 10));
    }
    if (e.code === 'Backspace'){ typed = typed.slice(0, -1); typedT = 1; setBlade(parseInt(typed || '0', 10)); }
  }
  if (e.code === 'KeyP' || e.code === 'Escape'){
    if (keypadOpen){ closeKeypad(false); return; }
    if (state === 'play') pause(); else if (state === 'paused') resume();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy.x = joy.y = 0; pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
function pause(){ if (state !== 'play') return; state = 'paused'; setTip(null); show('pauseScreen'); }
function resume(){ if (state !== 'paused') return; state = 'play'; show(null); last = performance.now(); }

// blade buttons: tap or hold to repeat
function holdRepeat(btn, fn){
  let t1 = 0, t2 = 0;
  const stop = () => { clearTimeout(t1); clearInterval(t2); btn.classList.remove('held'); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); if (state !== 'play') return; fn(); btn.classList.add('held'); t1 = setTimeout(() => { t2 = setInterval(fn, 70); }, 320); try { btn.setPointerCapture(e.pointerId); } catch(err){} });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => { if (e.code === 'Enter'){ e.preventDefault(); fn(); } });
}
holdRepeat($('minusBtn'), () => setBlade(player.blade - 1));
holdRepeat($('plusBtn'), () => setBlade(player.blade + 1));

// keypad for typing a blade number on touch screens
let kpVal = '';
function openKeypad(){ if (state !== 'play') return; keypadOpen = true; kpVal = ''; $('kpVal').textContent = '…'; $('keypad').hidden = false; }
function closeKeypad(apply){ if (apply && kpVal !== '') setBlade(parseInt(kpVal, 10)); keypadOpen = false; $('keypad').hidden = true; }
$('bladeBtn').addEventListener('click', () => { if (isPhone || !matchMedia('(hover:hover)').matches) openKeypad(); else openKeypad(); });
$('keypad').addEventListener('pointerdown', e => {
  const b = e.target.closest('button'); if (!b) return; e.preventDefault();
  const k = b.dataset.k;
  if (k === 'ok'){ closeKeypad(true); return; }
  if (k === 'del') kpVal = kpVal.slice(0, -1); else if (kpVal.length < 3) kpVal = (kpVal === '0' ? '' : kpVal) + k;
  $('kpVal').textContent = kpVal || '…';
});

// items
$('it-slow').addEventListener('click', () => useItem('slow'));
$('it-omni').addEventListener('click', () => useItem('omni'));
$('it-inv').addEventListener('click', () => useItem('inv'));

// joystick
(function(){
  const el = $('joy'), knob = $('joyKnob');
  let id = null;
  const setFrom = e => {
    const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    let dx = e.clientX - cx, dy = e.clientY - cy; const max = r.width * .38, d = Math.hypot(dx, dy);
    if (d > max){ dx *= max / d; dy *= max / d; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const nx = dx / max, ny = dy / max;
    joy.x = Math.hypot(nx, ny) < .2 ? 0 : nx; joy.y = Math.hypot(nx, ny) < .2 ? 0 : ny;
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); id = e.pointerId; try { el.setPointerCapture(id); } catch(err){} setFrom(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) setFrom(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
})();
// action buttons
$('atkBtn').addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'cut'){ skipCut(); return; } swing(); $('atkBtn').classList.add('held'); setTimeout(() => $('atkBtn').classList.remove('held'), 120); });
$('bowBtn').addEventListener('pointerdown', e => { e.preventDefault(); shootArrow(); });
(function(){
  const b = $('shieldBtn');
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys.touchShield = true; b.classList.add('held'); try { b.setPointerCapture(e.pointerId); } catch(err){} });
  const up = () => { keys.touchShield = false; b.classList.remove('held'); };
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
})();
document.querySelectorAll('.act, .bbtn, .joy').forEach(el => el.addEventListener('contextmenu', e => e.preventDefault()));

/* ---------- menus ---------- */
const sv0 = loadSave();
const op0 = sv0?.op || store.get('nk-op') || 'add', lv0 = sv0?.baseLv || +(store.get('nk-lv') || 1);
($('op-' + op0) || $('op-add')).checked = true;
($('lv-' + lv0) || $('lv-1')).checked = true;
function lvDesc(){
  const op = document.querySelector('input[name="op"]:checked').value, lv = +document.querySelector('input[name="lv"]:checked').value;
  $('lvDesc').textContent = op === 'mix' ? 'All four operations at level ' + lv : OPS[op].levels[lv - 1][0];
  store.set('nk-op', op); store.set('nk-lv', lv);
}
document.querySelectorAll('#titleScreen input').forEach(el => el.addEventListener('change', lvDesc));
lvDesc();
function begin(g, landing){ initAudio(); game = g; player = null; show(null); state = 'play'; startStage(landing); }
$('newBtn').onclick = () => { const g = newGameData(); g.stage = -1; begin(g, false); };
$('skipBtn').onclick = () => begin(newGameData(), true);
$('contBtn').onclick = () => { const sv = loadSave(); if (sv) begin(sv, false); };
$('skipTut').onclick = () => { if (state === 'play' && game.stage < 0) endTutorial(); };
$('musicBtn').onclick = () => setMusic(!musicOn);
cv.addEventListener('pointerdown', () => { if (state === 'cut') skipCut(); });
setMusic(musicOn);
$('resumeBtn').onclick = resume;
$('quitBtn').onclick = () => { save(); toTitle(); };

/* ---------- boot ---------- */
new ResizeObserver(resize).observe(stageEl);
resize();
toTitle();
// a demo room behind the title screen
game = newGameData(); dungeon = genDungeon(0); player = newPlayer(); room = [...dungeon.rooms.values()].find(r => r.type === 'fight'); buildTiles(room); spawnMonsters();
updateHud();
requestAnimationFrame(frame);
})();
</script>
