<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChessMate · Games 4 Ed</title>
<meta name="description" content="Endless mate-in-2 chess puzzles in three difficulty levels. Find the move that forces checkmate.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Rubik+Mono+One&display=swap">
<style>
/* Layout: one phone-height column. Header, level switch, board sized to the viewport, move line, actions. */
:root{
  --bg:#ffffff;
  --ink:#111111;
  --muted:#777777;
  --line:#e2e2e2;
  --soft:#f4f4f4;
  --sq-light:#fbf9ea;
  --sq-dark:#d6d6d6;
  --edge:#3a3a3a;
  --mark:rgba(0,0,0,.14);
  --good:#111111;
  --bad:#8a8a8a;
  --font-ui:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f0f;--ink:#f2f2f2;--muted:#8d8d8d;--line:#2a2a2a;--soft:#1a1a1a;
  --sq-light:#f3f0dc;--sq-dark:#c4c4c4;--edge:#000000;--mark:rgba(0,0,0,.18);--good:#f2f2f2;--bad:#8d8d8d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f0f;--ink:#f2f2f2;--muted:#8d8d8d;--line:#2a2a2a;--soft:#1a1a1a;
  --sq-light:#f3f0dc;--sq-dark:#c4c4c4;--edge:#000000;--mark:rgba(0,0,0,.18);--good:#f2f2f2;--bad:#8d8d8d;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{
  --board:min(100vw - 32px, 100dvh - 300px, 560px);
  min-height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;
  padding-block:14px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:12px}
@supports not (height:100dvh){.app{--board:min(100vw - 32px, 100vh - 300px, 560px)}}
.app>*{width:var(--board);max-width:100%;min-width:260px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.tally{display:flex;gap:14px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tally span{display:flex;align-items:baseline;gap:5px}
.tally b{font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px}
.seg button{font:500 13px/1 var(--font-ui);padding:7px 12px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.puzno{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.status{min-height:1.4em;font-size:14px;font-weight:500;text-align:left;margin-top:-4px}
.status.bad{color:var(--bad)}
.status.good{color:var(--good);font-weight:700}

.frame{border:1.5px solid var(--edge);box-sizing:border-box;line-height:0}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1/1;width:100%;position:relative;user-select:none;-webkit-user-select:none}
.sq{position:relative;border:0;padding:0;margin:0;cursor:pointer;aspect-ratio:1/1;min-width:0;display:block;font:inherit}
.sq.l{background:var(--sq-light)}.sq.d{background:var(--sq-dark)}
.sq:focus-visible{outline:2px solid #111;outline-offset:-2px;z-index:3}
.sq.last::before,.sq.sel::before{content:"";position:absolute;inset:0;background:var(--mark)}
.sq.sel::before{background:rgba(0,0,0,.26)}
.sq.hint::after{content:"";position:absolute;inset:7%;border:2px solid #111;border-radius:50%;z-index:2}
.sq.check::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,.45) 0%,rgba(0,0,0,.12) 60%,transparent 72%)}
.pc{position:absolute;inset:4%;background-size:contain;background-repeat:no-repeat;background-position:center;z-index:2;pointer-events:none}
.dot{position:absolute;left:37%;top:37%;width:26%;height:26%;border-radius:50%;background:rgba(0,0,0,.28);z-index:3;pointer-events:none}
.cap{position:absolute;inset:3%;border-radius:50%;border:3px solid rgba(0,0,0,.28);z-index:3;pointer-events:none}
.coord{position:absolute;font:600 9px/1 var(--font-ui);z-index:1;pointer-events:none;color:rgba(0,0,0,.42)}
.coord.f{right:2px;bottom:2px}.coord.r{left:2px;top:2px}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;line-height:1.4}
.overlay[hidden]{display:none!important}
.loading{background:rgba(255,255,255,.55);color:#111;font-size:13px;font-weight:600;letter-spacing:.04em}
.promo{background:rgba(0,0,0,.4)}
.promo div{background:var(--sq-light);border:1.5px solid #3a3a3a;display:flex}
.promo button{width:min(18vw,72px);aspect-ratio:1/1;border:0;background:transparent;cursor:pointer;background-size:80%;background-repeat:no-repeat;background-position:center}
.promo button:focus-visible{outline:2px solid #111;outline-offset:-2px}

.moves{font-family:var(--font-mono);font-size:14px;min-height:1.4em;color:var(--ink);white-space:nowrap;overflow-x:auto;font-variant-numeric:tabular-nums}
.moves .n{color:var(--muted)}
.moves .ph{color:var(--line)}

.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:6px}
button.b{font:500 14px/1 var(--font-ui);height:42px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--muted)}
button.b:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.b.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}

.solution{border-top:1px solid var(--line);padding-top:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.solution[hidden]{display:none!important}
.solution h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.solution .key{font-family:var(--font-mono);font-size:17px;font-weight:500}
.solution ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:2px 14px;font-family:var(--font-mono);font-size:12.5px}
.solution li span{color:var(--muted)}
.tries li{color:var(--muted)}
.tries li b{color:var(--ink);font-weight:500}

.foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted)}
.foot button,.foot a{font:500 12px/1 var(--font-ui);color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.foot button:focus-visible,.foot a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Move feedback: letters stamped onto the board as chunky tiles */
.pop{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:1}
.pop[hidden]{display:none!important}
.pop .words{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--board)*.025) calc(var(--board)*.04);max-width:92%}
.pop .word{display:flex;gap:calc(var(--board)*.008)}
.pop .tile{font-family:"Rubik Mono One","Arial Black",Impact,sans-serif;font-size:calc(var(--board)*.085);width:calc(var(--board)*.098);height:calc(var(--board)*.118);display:flex;align-items:center;justify-content:center;background:#111;color:#fbf9ea;box-shadow:calc(var(--board)*.012) calc(var(--board)*.012) 0 #fbf9ea,calc(var(--board)*.02) calc(var(--board)*.02) 0 #111;animation:tileIn .32s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*45ms)}
.pop.bad .tile{background:#fbf9ea;color:#111;box-shadow:calc(var(--board)*.012) calc(var(--board)*.012) 0 #111;outline:3px solid #111;outline-offset:-3px}
.pop.good .tile{animation-name:tileIn,tileHop;animation-duration:.32s,.5s;animation-delay:calc(var(--i)*45ms),calc(.4s + var(--i)*45ms);animation-timing-function:cubic-bezier(.2,1.6,.4,1),steps(3)}
.pop.bad .tile{animation-name:tileIn,tileShake;animation-duration:.32s,.36s;animation-delay:calc(var(--i)*35ms),.55s;animation-timing-function:cubic-bezier(.2,1.6,.4,1),steps(4)}
.pop.out .words{animation:popOut .22s steps(3) forwards}
@keyframes tileIn{0%{transform:translateY(-60%) scale(.2) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes tileHop{0%,100%{transform:none}50%{transform:translateY(-22%)}}
@keyframes tileShake{0%,100%{transform:none}25%{transform:translateX(-12%)}75%{transform:translateX(12%)}}
@keyframes popOut{to{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop .tile,.pop.out .words{animation:none!important}}

.credit{margin:0;font-size:11px;color:var(--muted)}
@media (max-width:360px){.seg button{padding:7px 9px}.tally{gap:10px}button.b{font-size:13px}}
</style>

<main class="app">
  <header>
    <h1>ChessMate</h1>
    <div class="tally" aria-live="polite">
      <span>Solved <b id="nSolved">0</b></span>
      <span>Streak <b id="nStreak">0</b></span>
      <span>Best <b id="nBest">0</b></span>
    </div>
  </header>

  <div class="row">
    <div class="seg" role="radiogroup" aria-label="Difficulty">
      <button type="button" id="lvl-easy" role="radio">Easy</button>
      <button type="button" id="lvl-medium" role="radio">Medium</button>
      <button type="button" id="lvl-hard" role="radio">Hard</button>
    </div>
    <div class="puzno" id="puzNo">Mate in 2</div>
  </div>

  <div class="status" id="status" aria-live="polite">White to move. Mate in 2.</div>

  <div class="frame">
    <div class="board" id="board" role="grid" aria-label="Chess board">
      <div class="overlay promo" id="promo" hidden><div id="promoRow"></div></div>
      <div class="overlay loading" id="loading">Setting up…</div>
      <div class="pop" id="pop" hidden aria-hidden="true"></div>
    </div>
  </div>

  <div class="moves" id="moves" aria-label="Moves played"></div>

  <div class="actions">
    <button class="b" id="btnHint">Hint</button>
    <button class="b" id="btnReset">Retry</button>
    <button class="b" id="btnShow">Answer</button>
    <button class="b primary" id="btnNext">Next</button>
  </div>

  <section class="solution" id="solution" hidden>
    <h3>Solution</h3>
    <div class="key" id="solKey"></div>
    <ul id="solLines"></ul>
    <div id="triesBox" hidden>
      <h3>Tempting tries</h3>
      <ul id="triesList" class="tries"></ul>
    </div>
  </section>

  <div class="foot">
    <span id="lvlNote"></span>
    <button id="btnCopy">Copy FEN</button>
    <a id="lichess" href="#" target="_blank" rel="noopener">Open in Lichess</a>
    <a href="../../">← All games</a>
  </div>
  <p class="credit">Chess pieces by Colin M.L. Burnett.</p>
</main>

    }

    turn = tokens[1]

    if (tokens[2].indexOf('K') > -1) {
      castling.w |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('Q') > -1) {
      castling.w |= BITS.QSIDE_CASTLE
    }
    if (tokens[2].indexOf('k') > -1) {
      castling.b |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('q') > -1) {
      castling.b |= BITS.QSIDE_CASTLE
    }

    ep_square = tokens[3] === '-' ? EMPTY : SQUARES[tokens[3]]
    half_moves = parseInt(tokens[4], 10)
    move_number = parseInt(tokens[5], 10)

    update_setup(generate_fen())

    return true
  }

  /* TODO: this function is pretty much crap - it validates structure but
   * completely ignores content (e.g. doesn't verify that each side has a king)
   * ... we should rewrite this, and ditch the silly error_number field while
   * we're at it
   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square'
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(tokens[5]) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(tokens[4]) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }
  }

  function generate_fen() {
    var empty = 0
    var fen = ''

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      if (board[i] == null) {
        empty++
      } else {
        if (empty > 0) {
          fen += empty
          empty = 0
        }
        var color = board[i].color
        var piece = board[i].type

        fen += color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
      }

      if ((i + 1) & 0x88) {
        if (empty > 0) {
          fen += empty
        }

        if (i !== SQUARES.h1) {
          fen += '/'
        }

        empty = 0
        i += 8
      }
    }

    var cflags = ''
    if (castling[WHITE] & BITS.KSIDE_CASTLE) {
      cflags += 'K'
    }
    if (castling[WHITE] & BITS.QSIDE_CASTLE) {
      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

    /* do we have an empty castling flag? */
    cflags = cflags || '-'
    var epflags = ep_square === EMPTY ? '-' : algebraic(ep_square)

    return [fen, turn, cflags, epflags, half_moves, move_number].join(' ')
  }

  function set_header(args) {
    for (var i = 0; i < args.length; i += 2) {
      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARES[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARES)) {
      return false
    }

    var sq = SQUARES[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARES[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARES.a8
    var last_sq = SQUARES.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARES) {
        first_sq = last_sq = SQUARES[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (!single_square || last_sq === kings[us]) {
      /* king-side castling */
      if (castling[us] & BITS.KSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from + 2

        if (
          board[castling_from + 1] == null &&
          board[castling_to] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from + 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
        }
      }

      /* queen-side castling */
      if (castling[us] & BITS.QSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from - 2

        if (
          board[castling_from - 1] == null &&
          board[castling_from - 2] == null &&
          board[castling_from - 3] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from - 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, sloppy) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      var disambiguator = get_disambiguator(move, sloppy)

      if (move.piece !== PAWN) {
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  // parses all of the decorators out of a SAN string
  function stripped_san(move) {
    return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
  }

  function attacked(color, square) {
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen()
        .split(' ')
        .slice(0, 4)
        .join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  /* this function is used to uniquely identify ambiguous moves */
  function get_disambiguator(move, sloppy) {
    var moves = generate_moves({ legal: !sloppy })

    var from = move.from
    var to = move.to
    var piece = move.piece

    var ambiguities = 0
    var same_rank = 0
    var same_file = 0

    for (var i = 0, len = moves.length; i < len; i++) {
      var ambig_from = moves[i].from
      var ambig_to = moves[i].to
      var ambig_piece = moves[i].piece

      /* if a move of the same piece type ends on the same to square, we'll
       * need to add a disambiguator to the algebraic notation
       */
      if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
        ambiguities++

        if (rank(from) === rank(ambig_from)) {
          same_rank++
        }

        if (file(from) === file(ambig_from)) {
          same_file++
        }
      }
    }

    if (ambiguities > 0) {
      /* if there exists a similar moving piece on the same rank and file as
       * the move in question, use the square as the disambiguator
       */
      if (same_rank > 0 && same_file > 0) {
        return algebraic(from)
      } else if (same_file > 0) {
        /* if the moving piece rests on the same file, use the rank symbol as the
         * disambiguator
         */
        return algebraic(from).charAt(1)
      } else {
        /* else use the file symbol */
        return algebraic(from).charAt(0)
      }
    }

    return ''
  }

  function ascii() {
    var s = '   +------------------------+\n'
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* display the rank */
      if (file(i) === 0) {
        s += ' ' + '87654321'[rank(i)] + ' |'
      }

      /* empty piece */
      if (board[i] == null) {
        s += ' . '
      } else {
        var piece = board[i].type
        var color = board[i].color
        var symbol = color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
        s += ' ' + symbol + ' '
      }

      if ((i + 1) & 0x88) {
        s += '|\n'
        i += 8
      }
    }
    s += '   +------------------------+\n'
    s += '     a  b  c  d  e  f  g  h\n'

    return s
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?!
    var clean_move = stripped_san(move)

    // if we're using the sloppy parser run a regex to grab piece, to, and from
    // this should parse invalid SAN like: Pe2-e4, Rc1c4, Qf3xf7
    if (sloppy) {
      var matches = clean_move.match(
        /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
      )
      if (matches) {
        var piece = matches[1]
        var from = matches[2]
        var to = matches[3]
        var promotion = matches[4]
      }
    }

    var moves = generate_moves()
    for (var i = 0, len = moves.length; i < len; i++) {
      // try the strict parser first, then the sloppy parser if requested
      // by the user
      if (
        clean_move === stripped_san(move_to_san(moves[i])) ||
        (sloppy && clean_move === stripped_san(move_to_san(moves[i], true)))
      ) {
        return moves[i]
      } else {
        if (
          matches &&
          (!piece || piece.toLowerCase() == moves[i].piece) &&
          SQUARES[from] == moves[i].from &&
          SQUARES[to] == moves[i].to &&
          (!promotion || promotion.toLowerCase() == moves[i].promotion)
        ) {
          return moves[i]
        }
      }
    }

    return null
  }

  /*****************************************************************************
   * UTILITY FUNCTIONS
   ****************************************************************************/
  function rank(i) {
    return i >> 4
  }

  function file(i) {
    return i & 15
  }

  function algebraic(i) {
    var f = file(i),
      r = rank(i)
    return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
  }

  function swap_color(c) {
    return c === WHITE ? BLACK : WHITE
  }

  function is_digit(c) {
    return '0123456789'.indexOf(c) !== -1
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, false)
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  function clone(obj) {
    var dupe = obj instanceof Array ? [] : {}

    for (var property in obj) {
      if (typeof property === 'object') {
        dupe[property] = clone(obj[property])
      } else {
        dupe[property] = obj[property]
      }
    }

    return dupe
  }

  function trim(str) {
    return str.replace(/^\s+|\s+$/g, '')
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC CONSTANTS (is there a better way to do this?)
     **************************************************************************/
    WHITE: WHITE,
    BLACK: BLACK,
    PAWN: PAWN,
    KNIGHT: KNIGHT,
    BISHOP: BISHOP,
    ROOK: ROOK,
    QUEEN: QUEEN,
    KING: KING,
    SQUARES: (function() {
      /* from the ECMA-262 spec (section 12.6.4):
       * "The mechanics of enumerating the properties ... is
       * implementation dependent"
       * so: for (var sq in SQUARES) { keys.push(sq); } might not be
       * ordered correctly
       */
      var keys = []
      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (i & 0x88) {
          i += 7
          continue
        }
        keys.push(algebraic(i))
      }
      return keys
    })(),
    FLAGS: FLAGS,

    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function(fen) {
      return load(fen)
    },

    reset: function() {
      return reset()
    },

    moves: function(options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(move_to_san(ugly_moves[i], false))
        }
      }

      return moves
    },

    in_check: function() {
      return in_check()
    },

    in_checkmate: function() {
      return in_checkmate()
    },

    in_stalemate: function() {
      return in_stalemate()
    },

    in_draw: function() {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function() {
      return insufficient_material()
    },

    in_threefold_repetition: function() {
      return in_threefold_repetition()
    },

    game_over: function() {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function(fen) {
      return validate_fen(fen)
    },

    fen: function() {
      return generate_fen()
    },

    board: function() {
      var output = [],
        row = []

      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({ type: board[i].type, color: board[i].color })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    pgn: function(options) {
      /* using the specification from http://www.chessclub.com/help/PGN-spec
       * example for html usage: .pgn({ max_width: 72, newline_char: "<br />" })
       */
      var newline =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\n'
      var max_width =
        typeof options === 'object' && typeof options.max_width === 'number'
          ? options.max_width
          : 0
      var result = []
      var header_exists = false

      /* add the PGN header headerrmation */
      for (var i in header) {
        /* TODO: order of enumerated properties in header object is not
         * guaranteed, see ECMA-262 spec (section 12.6.4)
         */
        result.push('[' + i + ' "' + header[i] + '"]' + newline)
        header_exists = true
      }

      if (header_exists && history.length) {
        result.push(newline)
      }

      /* pop all of history onto reversed_history */
      var reversed_history = []
      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      var moves = []
      var move_string = ''

      /* build the list of moves.  a move_string looks like: "3. e3 e6" */
      while (reversed_history.length > 0) {
        var move = reversed_history.pop()

        /* if the position started with black to move, start PGN with 1. ... */
        if (!history.length && move.color === 'b') {
          move_string = move_number + '. ...'
        } else if (move.color === 'w') {
          /* store the previous generated move_string if we have one */
          if (move_string.length) {
            moves.push(move_string)
          }
          move_string = move_number + '.'
        }

        move_string = move_string + ' ' + move_to_san(move, false)
        make_move(move)
      }

      /* are there any other leftover moves? */
      if (move_string.length) {
        moves.push(move_string)
      }

      /* is there a result? */
      if (typeof header.Result !== 'undefined') {
        moves.push(header.Result)
      }

      /* history should be back to what is was before we started generating PGN,
       * so join together moves
       */
      if (max_width === 0) {
        return result.join('') + moves.join(' ')
      }

      /* wrap the PGN output at max_width */
      var current_width = 0
      for (var i = 0; i < moves.length; i++) {
        /* if the current move will push past max_width */
        if (current_width + moves[i].length > max_width && i !== 0) {
          /* don't end the line with whitespace */
          if (result[result.length - 1] === ' ') {
            result.pop()
          }

          result.push(newline)
          current_width = 0
        } else if (i !== 0) {
          result.push(' ')
          current_width++
        }
        result.push(moves[i])
        current_width += moves[i].length
      }

      return result.join('')
    },

    load_pgn: function(pgn, options) {
      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      function mask(str) {
        return str.replace(/\\/g, '\\')
      }

      function has_keys(object) {
        for (var key in object) {
          return true
        }
        return false
      }

      function parse_pgn_header(header, options) {
        var newline_char =
          typeof options === 'object' &&
          typeof options.newline_char === 'string'
            ? options.newline_char
            : '\r?\n'
        var header_obj = {}
        var headers = header.split(new RegExp(mask(newline_char)))
        var key = ''
        var value = ''

        for (var i = 0; i < headers.length; i++) {
          key = headers[i].replace(/^\[([A-Z][A-Za-z]*)\s.*\]$/, '$1')
          value = headers[i].replace(/^\[[A-Za-z]+\s"(.*)"\]$/, '$1')
          if (trim(key).length > 0) {
            header_obj[key] = value
          }
        }

        return header_obj
      }

      var newline_char =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\r?\n'

      // RegExp to split header. Takes advantage of the fact that header and movetext
      // will always have a blank line between them (ie, two newline_char's).
      // With default newline_char, will equal: /^(\[((?:\r?\n)|.)*\])(?:\r?\n){2}/
      var header_regex = new RegExp(
        '^(\\[((?:' +
          mask(newline_char) +
          ')|.)*\\])' +
          '(?:' +
          mask(newline_char) +
          '){2}'
      )

      // If no header given, begin with moves.
      var header_string = header_regex.test(pgn)
        ? header_regex.exec(pgn)[1]
        : ''

      // Put the board in the starting position
      reset()

      /* parse PGN header */
      var headers = parse_pgn_header(header_string, options)
      for (var key in headers) {
        set_header([key, headers[key]])
      }

      /* load the starting position indicated by [Setup '1'] and
       * [FEN position] */
      if (headers['SetUp'] === '1') {
        if (!('FEN' in headers && load(headers['FEN'], true))) {
          // second argument to load: don't clear the headers
          return false
        }
      }

      /* delete header to get the moves */
      var ms = pgn
        .replace(header_string, '')
        .replace(new RegExp(mask(newline_char), 'g'), ' ')

      /* delete comments */
      ms = ms.replace(/(\{[^}]+\})+?/g, '')

      /* delete recursive annotation variations */
      var rav_regex = /(\([^\(\)]+\))+?/g
      while (rav_regex.test(ms)) {
        ms = ms.replace(rav_regex, '')
      }

      /* delete move numbers */
      ms = ms.replace(/\d+\.(\.\.)?/g, '')

      /* delete ... indicating black to move */
      ms = ms.replace(/\.\.\./g, '')

      /* delete numeric annotation glyphs */
      ms = ms.replace(/\$\d+/g, '')

      /* trim and get array of moves */
      var moves = trim(ms).split(new RegExp(/\s+/))

      /* delete empty entries */
      moves = moves
        .join(',')
        .replace(/,,+/g, ',')
        .split(',')
      var move = ''

      for (var half_move = 0; half_move < moves.length - 1; half_move++) {
        move = move_from_san(moves[half_move], sloppy)

        /* move not possible! (don't clear the board to examine to show the
         * latest valid position)
         */
        if (move == null) {
          return false
        } else {
          make_move(move)
        }
      }

      /* examine last move */
      move = moves[moves.length - 1]
      if (POSSIBLE_RESULTS.indexOf(move) > -1) {
        if (has_keys(header) && typeof header.Result === 'undefined') {
          set_header(['Result', move])
        }
      } else {
        move = move_from_san(move, sloppy)
        if (move == null) {
          return false
        } else {
          make_move(move)
        }
      }
      return true
    },

    header: function() {
      return set_header(arguments)
    },

    ascii: function() {
      return ascii()
    },

    turn: function() {
      return turn
    },

    move: function(move, options) {
      /* The move function can be called with in the following parameters:
       *
       * .move('Nxb7')      <- where 'move' is a case-sensitive SAN string
       *
       * .move({ from: 'h7', <- where the 'move' is a move object (additional
       *         to :'h8',      fields are ignored)
       *         promotion: 'q',
       *      })
       */

      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      var move_obj = null

      if (typeof move === 'string') {
        move_obj = move_from_san(move, sloppy)
      } else if (typeof move === 'object') {
        var moves = generate_moves()

        /* convert the pretty move object to an ugly move object */
        for (var i = 0, len = moves.length; i < len; i++) {
          if (
            move.from === algebraic(moves[i].from) &&
            move.to === algebraic(moves[i].to) &&
            (!('promotion' in moves[i]) ||
              move.promotion === moves[i].promotion)
          ) {
            move_obj = moves[i]
            break
          }
        }
      }

      /* failed to find move */
      if (!move_obj) {
        return null
      }

      /* need to make a copy of move because we can't generate SAN after the
       * move is made
       */
      var pretty_move = make_pretty(move_obj)

      make_move(move_obj)

      return pretty_move
    },

    undo: function() {
      var move = undo_move()
      return move ? make_pretty(move) : null
    },

    clear: function() {
      return clear()
    },

    put: function(piece, square) {
      return put(piece, square)
    },

    get: function(square) {
      return get(square)
    },

    remove: function(square) {
      return remove(square)
    },

    perft: function(depth) {
      return perft(depth)
    },

    square_color: function(square) {
      if (square in SQUARES) {
        var sq_0x88 = SQUARES[square]
        return (rank(sq_0x88) + file(sq_0x88)) % 2 === 0 ? 'light' : 'dark'
      }

      return null
    },

    history: function(options) {
      var reversed_history = []
      var move_history = []
      var verbose =
        typeof options !== 'undefined' &&
        'verbose' in options &&
        options.verbose

      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      while (reversed_history.length > 0) {
        var move = reversed_history.pop()
        if (verbose) {
          move_history.push(make_pretty(move))
        } else {
          move_history.push(move_to_san(move))
        }
        make_move(move)
      }

      return move_history
    }
  }
}

/* export Chess object if using node or any other CommonJS compatible
 * environment */
if (typeof exports !== 'undefined') exports.Chess = Chess
/* export Chess object for any RequireJS compatible environment */
if (typeof define !== 'undefined')
  define(function() {
    return Chess
  })

      if(occ(f,r))continue;
      if(t==='p'&&(r===0||r===7))continue;
      if(t==='b'){const sc=(f+r)%2;if(bishopColor[side]===sc)continue;bishopColor[side]=sc;}
      B[sqn(f,r)]=p;cnt[side][t]++;return;}
  };
  const nW=rich?2+rnd(3):1+rnd(3)+(Math.random()<0.4?1:0);
  const wPool=['Q','Q','R','R','R','B','B','N','N','N','P','P'];
  const zoneW=near(bf,br,4);
  for(let i=0;i<nW;i++)place(pick(wPool),Math.random()<0.75?zoneW:null);
  const nB=rich?1+rnd(5):rnd(5);const bPool=['p','p','p','p','r','b','n','q'];const zoneB=near(bf,br,2);
  for(let i=0;i<nB;i++)place(pick(bPool),Math.random()<0.7?zoneB:null);
  const rows=[];
  for(let r=7;r>=0;r--){let s='',e=0;for(let f=0;f<8;f++){const p=B[sqn(f,r)];if(p){if(e){s+=e;e=0;}s+=p;}else e++;}if(e)s+=e;rows.push(s);}
  return rows.join('/')+' w - - 0 1';
}
/* Tiny 0x88 move generator used only by the puzzle solver. No castling (puzzles never have rights). */
function makeEngine(){
  const N=-16,S=16,E=1,W=-1;
  const KN=[-33,-31,-18,-14,14,18,31,33];
  const KG=[-17,-16,-15,-1,1,15,16,17];
  const DI=[-17,-15,15,17],OR=[-16,-1,1,16];
  // rank 0 = rank 8 (top) in 0x88 indexing: idx = (7-rank)*16+file
  const B=new Array(128).fill(null);
  let side='w',ep=-1;const kpos={w:-1,b:-1};
  const col=p=>p===p.toUpperCase()?'w':'b';
  function load(fen){
    B.fill(null);const [pl,s,,e]=fen.split(' ');let r=0,f=0;
    for(const c of pl){if(c==='/'){r++;f=0;}else if(/\d/.test(c))f+=+c;else{const i=r*16+f;B[i]=c;if(c==='K')kpos.w=i;if(c==='k')kpos.b=i;f++;}}
    side=s;ep=(e&&e!=='-')?((8-(+e[1]))*16+(e.charCodeAt(0)-97)):-1;
  }
  function attacked(sq,by){
    // pawns
    if(by==='w'){for(const d of [15,17]){const i=sq+d;if(!(i&0x88)&&B[i]==='P')return true;}}
    else{for(const d of [-15,-17]){const i=sq+d;if(!(i&0x88)&&B[i]==='p')return true;}}
    const up=by==='w';
    for(const d of KN){const i=sq+d;if(!(i&0x88)&&B[i]===(up?'N':'n'))return true;}
    for(const d of KG){const i=sq+d;if(!(i&0x88)&&B[i]===(up?'K':'k'))return true;}
    for(const d of DI){let i=sq+d;while(!(i&0x88)){const p=B[i];if(p){if(p===(up?'B':'b')||p===(up?'Q':'q'))return true;break;}i+=d;}}
    for(const d of OR){let i=sq+d;while(!(i&0x88)){const p=B[i];if(p){if(p===(up?'R':'r')||p===(up?'Q':'q'))return true;break;}i+=d;}}
    return false;
  }
  function pseudo(){
    const out=[];const me=side;const up=me==='w';
    for(let i=0;i<128;i++){
      if(i&0x88){i+=7;continue;}
      const p=B[i];if(!p||col(p)!==me)continue;
      const t=p.toLowerCase();
      if(t==='p'){
        const d=up?-16:16,start=up?6:1,last=up?0:7;
        const one=i+d;
        if(!(one&0x88)&&!B[one]){
          if((one>>4)===last){for(const pr of 'qrbn')out.push({f:i,t:one,pr});}
          else{out.push({f:i,t:one});const two=one+d;if((i>>4)===start&&!B[two])out.push({f:i,t:two,dbl:1});}
        }
        for(const c of [d-1,d+1]){const j=i+c;if(j&0x88)continue;
          if(B[j]&&col(B[j])!==me){if((j>>4)===last){for(const pr of 'qrbn')out.push({f:i,t:j,pr});}else out.push({f:i,t:j});}
          else if(j===ep)out.push({f:i,t:j,ep:1});}
      }else if(t==='n'||t==='k'){
        for(const d of (t==='n'?KN:KG)){const j=i+d;if(j&0x88)continue;const q=B[j];if(!q||col(q)!==me)out.push({f:i,t:j});}
      }else{
        const ds=t==='b'?DI:t==='r'?OR:DI.concat(OR);
        for(const d of ds){let j=i+d;while(!(j&0x88)){const q=B[j];if(!q)out.push({f:i,t:j});else{if(col(q)!==me)out.push({f:i,t:j});break;}j+=d;}}
      }
    }
    return out;
  }
  const stack=[];
  function make(m){
    const p=B[m.f];const st={m,cap:B[m.t],ep,capSq:m.t,p};
    if(m.ep){st.capSq=m.t+(side==='w'?16:-16);st.cap=B[st.capSq];B[st.capSq]=null;}
    B[m.t]=m.pr?(side==='w'?m.pr.toUpperCase():m.pr):p;B[m.f]=null;
    if(p==='K')kpos.w=m.t;else if(p==='k')kpos.b=m.t;
    ep=m.dbl?(m.f+m.t)/2:-1;
    side=side==='w'?'b':'w';stack.push(st);
  }
  function unmake(){
    const st=stack.pop();const m=st.m;side=side==='w'?'b':'w';
    B[m.f]=st.p;B[m.t]=null;if(st.cap)B[st.capSq]=st.cap;
    if(st.p==='K')kpos.w=m.f;else if(st.p==='k')kpos.b=m.f;
    ep=st.ep;
  }
  function inCheck(){return attacked(kpos[side],side==='w'?'b':'w');}
  function legal(){
    const out=[];const me=side,op=me==='w'?'b':'w';
    for(const m of pseudo()){make(m);if(!attacked(kpos[me],op))out.push(m);unmake();}
    return out;
  }
  function hasLegal(){
    const me=side,op=me==='w'?'b':'w';
    for(const m of pseudo()){make(m);const ok=!attacked(kpos[me],op);unmake();if(ok)return true;}
    return false;
  }
  function findMate(){ // side to move mates in 1?
    for(const m of legal()){make(m);const mate=inCheck()&&!hasLegal();unmake();if(mate)return m;}
    return null;
  }
  const sqName=i=>'abcdefgh'[i&7]+(8-(i>>4));
  // Solve mate in 2. Returns {key, tries} if unique key, else null. tries = white first moves refuted by exactly one black move.
  function solve(fen){
    load(fen);
    if(side!=='w')return null;
    if(attacked(kpos.b,'w'))return null;
    const ws=legal();if(!ws.length)return null;
    if(findMate())return null;
    let key=null,tries=0;const tryList=[];
    let info=null;
    for(const m of ws){
      const cap=!!B[m.t]||!!m.ep;
      make(m);
      const chk=inCheck();
      const bs=legal();
      if(!bs.length){unmake();continue;} // stalemate (mate already excluded)
      let refut=0,rm=null;
      for(const b of bs){make(b);const mm=findMate();unmake();if(!mm){refut++;rm=b;if(refut>1)break;}}
      unmake();
      if(refut===0){if(key)return null;key=m;info={cap,chk,nb:bs.length};}
      else if(refut===1){tries++;tryList.push({m:{from:sqName(m.f),to:sqName(m.t),promotion:m.pr},r:{from:sqName(rm.f),to:sqName(rm.t),promotion:rm.pr}});}
    }
    if(!key)return null;
    const quiet=!info.cap&&!info.chk;
    const level=!quiet?'easy':(tries>=2&&info.nb>=5?'hard':'medium');
    return {key:{from:sqName(key.f),to:sqName(key.t),promotion:key.pr},tries,tryList,level};
  }
  return {solve};
}

const ENG=makeEngine();
/* chess.js only for the accepted puzzle: notation for the key, every defense and its mate. */
function mateIn1(ch){return ch.moves({verbose:true}).find(m=>m.san.indexOf('#')>=0)||null;}
function describe(fen,s){
  const ch=new Chess(fen);
  const key=ch.move(s.key);
  const replies=ch.moves({verbose:true});
  const lines=[];
  for(const b of replies){ch.move(b);const mm=mateIn1(ch);ch.undo();if(mm)lines.push([b.san,mm.san]);}
  ch.undo();
  const quiet=!key.captured&&!/[+#]/.test(key.san);
  const level=s.level;
  const tries=s.tryList.slice(0,6).map(t=>{const c=new Chess(fen);const a=c.move(t.m);const r=c.move(t.r);return [a.san,r.san];});
  return {fen,key,lines,quiet,level,tries,nTries:s.tries,nReplies:replies.length};
}

/* Background composer: short slices keep the page responsive; a few puzzles per level stay ready. */
const LEVELS=['easy','medium','hard'];
const buckets={easy:[],medium:[],hard:[]};let composing=false;let waiter=null;
function compose(){
  if(composing)return;composing=true;
  const step=()=>{
    const t0=performance.now();
    while(performance.now()-t0<16){
      const fen=randomPosition(level==='hard'&&Math.random()<0.5);
      const s=ENG.solve(fen);
      if(!s)continue;
      const wanted=(waiter&&waiter.level===s.level)||buckets[s.level].length<(s.level===level?4:2);
      if(!wanted)continue;
      const p=describe(fen,s);
      if(waiter&&waiter.level===p.level){const w=waiter;waiter=null;w.res(p);}
      else if(buckets[p.level].length<8)buckets[p.level].push(p);
    }
    if(buckets[level].length<3||waiter)setTimeout(step,0);else composing=false;
  };
  setTimeout(step,0);
}
function nextPuzzle(){
  return new Promise(res=>{
    const bk=buckets[level];
    if(bk.length){res(bk.shift());compose();}
    else{waiter={level,res};compose();}
  });
}



/* ---------- Game state & UI ---------- */
const $=id=>document.getElementById(id);
const boardEl=$('board');
let level='medium';
const LEVEL_NOTE={easy:'Easy: the first move is a check or capture.',medium:'Medium: the first move is quiet.',hard:'Hard: quiet first move, more defenses, decoy moves.'};
let stats={solved:0,streak:0,best:0,count:0};
try{const s=JSON.parse(localStorage.getItem('m2stats')||'null');if(s)stats=Object.assign(stats,s);}catch(e){}
function saveStats(){try{localStorage.setItem('m2stats',JSON.stringify(stats));}catch(e){}}
try{const l=localStorage.getItem('m2level');if(LEVELS.includes(l))level=l;}catch(e){}
function showLevel(){LEVELS.forEach(l=>$('lvl-'+l).setAttribute('aria-checked',l===level?'true':'false'));$('lvlNote').textContent=LEVEL_NOTE[level];}
showLevel();

let puz=null,game=null,phase='loading',sel=null,last=null,lastBlack=null,hintSq=null,movesPlayed=[],missed=false,busy=false;
const NAME={k:'king',q:'queen',r:'rook',b:'bishop',n:'knight',p:'pawn'};

const squares=[];
for(let r=7;r>=0;r--)for(let f=0;f<8;f++){
  const b=document.createElement('button');
  const name=sqn(f,r);
  b.className='sq '+((f+r)%2?'l':'d');
  b.dataset.sq=name;
  if(r===0){const c=document.createElement('span');c.className='coord f';c.textContent=FILES[f];b.appendChild(c);}
  if(f===0){const c=document.createElement('span');c.className='coord r';c.textContent=r+1;b.appendChild(c);}
  b.addEventListener('click',()=>onSquare(name));
  boardEl.appendChild(b);squares.push(b);
}

function render(){
  const targets=sel?game.moves({square:sel,verbose:true}):[];
  const kingSq=game.in_check()?findKing(game.turn()):null;
  for(const el of squares){
    const s=el.dataset.sq;
    el.querySelectorAll('.pc,.dot,.cap').forEach(n=>n.remove());
    el.classList.toggle('sel',s===sel);
    el.classList.toggle('last',!!last&&(s===last.from||s===last.to)&&s!==sel);
    el.classList.toggle('hint',s===hintSq);
    el.classList.toggle('check',s===kingSq);
    const p=game.get(s);
    if(p){const sp=document.createElement('span');sp.className='pc';sp.style.backgroundImage=`url("${PIECE_IMG[p.color+p.type]}")`;el.appendChild(sp);
      el.setAttribute('aria-label',s+', '+(p.color==='w'?'white ':'black ')+NAME[p.type]);}
    else el.setAttribute('aria-label',s);
    const t=targets.find(m=>m.to===s);
    if(t){const d=document.createElement('span');d.className=t.captured?'cap':'dot';el.appendChild(d);}
  }
  renderMoves();
}
function findKing(c){for(const el of squares){const p=game.get(el.dataset.sq);if(p&&p.type==='k'&&p.color===c)return el.dataset.sq;}return null;}
function renderMoves(){
  const m=movesPlayed,ph=x=>m[x]||'<span class="ph">···</span>';
  $('moves').innerHTML=`<span class="n">1.</span> ${ph(0)} ${ph(1)}  <span class="n">2.</span> ${ph(2)}`;
}
let popTimer=null,popOutTimer=null;
function pop(text,kind,hold){
  const el=$('pop');clearTimeout(popTimer);clearTimeout(popOutTimer);
  let i=0;
  el.innerHTML='<div class="words">'+text.split(' ').map(w=>'<div class="word">'+[...w].map(c=>`<span class="tile" style="--i:${i++}">${c}</span>`).join('')+'</div>').join('')+'</div>';
  el.className='pop '+kind;el.hidden=false;
  popTimer=setTimeout(()=>{el.classList.add('out');popOutTimer=setTimeout(()=>{el.hidden=true;},240);},hold||1100);
}
function setStatus(t,kind){const s=$('status');s.textContent=t;s.className='status'+(kind?' '+kind:'');}
function tally(){$('nSolved').textContent=stats.solved;$('nStreak').textContent=stats.streak;$('nBest').textContent=stats.best;}

function onSquare(s){
  if(busy||!game||(phase!=='key'&&phase!=='mate'))return;
  const p=game.get(s);
  if(sel){
    const ms=game.moves({square:sel,verbose:true}).filter(m=>m.to===s);
    if(ms.length){
      if(ms.length>1&&ms[0].promotion){askPromo(ms);return;}
      tryMove(ms[0]);return;
    }
  }
  sel=(p&&p.color==='w'&&s!==sel)?s:null;
  render();
}
function askPromo(ms){
  const row=$('promoRow');row.innerHTML='';
  ['q','r','b','n'].forEach(t=>{const m=ms.find(x=>x.promotion===t);if(!m)return;
    const b=document.createElement('button');b.style.backgroundImage=`url("${PIECE_IMG['w'+t]}")`;b.setAttribute('aria-label','Promote to '+NAME[t]);
    b.onclick=()=>{$('promo').hidden=true;tryMove(m);};row.appendChild(b);});
  $('promo').hidden=false;
}

function tryMove(m){
  sel=null;hintSq=null;
  const done=game.move({from:m.from,to:m.to,promotion:m.promotion});
  last=done;movesPlayed.push(done.san);
  if(phase==='key'){
    const isKey=done.from===puz.key.from&&done.to===puz.key.to&&(done.promotion||'')===(puz.key.promotion||'');
    if(isKey){
      offPath=null;
      render();setStatus('Black replies…');busy=true;
      setTimeout(blackReply,520);
    }else{
      const def=findDefense();
      render();
      if(def){
        // Wrong first move: play on silently. Black answers with a real defense, and the verdict comes after White's second move.
        offPath={first:done.san,def:null};busy=true;setStatus('Black replies…');
        setTimeout(()=>{const d=game.move(def);last=d;lastBlack=d;offPath.def=d.san;movesPlayed.push(d.san);
          phase='mate';busy=false;render();setStatus(`Black played ${d.san}. Now mate.`);},520);
      }else{
        miss();pop('TRY AGAIN…','bad',1300);
        setStatus(game.in_checkmate()?'That is mate in 1. This one needs two.':(game.in_stalemate()?`${done.san} is stalemate. Try again.`:'Not the key. Try again.'),'bad');
        busy=true;setTimeout(()=>{busy=false;resetPos();},1500);
      }
    }
  }else if(phase==='mate'){
    render();
    if(offPath){
      const o=offPath;offPath=null;
      miss();busy=true;pop('TRY AGAIN…','bad',1300);
      setStatus(`No mate there. After 1. ${o.first}, Black's ${o.def} holds. Try a different first move.`,'bad');
      setTimeout(()=>{busy=false;resetPos();},1900);
    }else if(game.in_checkmate()){
      phase='solved';
      if(!missed){stats.solved++;stats.streak++;stats.best=Math.max(stats.best,stats.streak);}
      saveStats();tally();
      pop("THAT'S MATE!",'good',1700);
      setStatus(missed?'Checkmate.':'Checkmate. Clean solve.','good');
      showSolution();
    }else{
      miss();busy=true;setStatus(`${done.san} isn't mate. Look again.`,'bad');pop('TRY AGAIN…','bad',1000);
      setTimeout(()=>{game.undo();movesPlayed.pop();last=lastBlack;busy=false;render();setStatus('Now deliver mate.');},1100);
    }
  }
}
function findDefense(){
  const outs=game.moves({verbose:true}).filter(b=>{game.move(b);const mm=mateIn1(game);game.undo();return !mm;});
  return outs.length?pick(outs):null;
}
function blackReply(){
  const bs=game.moves({verbose:true});
  const weighted=[];bs.forEach(b=>{const w=(b.piece==='k'?3:1)+(b.captured?2:0);for(let i=0;i<w;i++)weighted.push(b);});
  const b=game.move(pick(weighted));
  last=b;lastBlack=b;movesPlayed.push(b.san);
  phase='mate';busy=false;render();
  setStatus(`Black played ${b.san}. Now mate.`);
}
let offPath=null;
function miss(){if(!missed){missed=true;stats.streak=0;saveStats();tally();}}
function resetPos(){
  offPath=null;
  game=new Chess(puz.fen);movesPlayed=[];last=null;sel=null;phase='key';render();
  setStatus('White to move. Mate in 2.');
}

function showSolution(){
  $('solKey').textContent='1. '+puz.key.san+(puz.quiet?'!':'');
  const ul=$('solLines');ul.innerHTML='';
  const seen=new Set();
  puz.lines.forEach(([b,w])=>{const k=b+w;if(seen.has(k))return;seen.add(k);
    const li=document.createElement('li');li.innerHTML=`<span>1…</span>${b} <span>2.</span>${w}`;ul.appendChild(li);});
  const tl=$('triesList');tl.innerHTML='';
  puz.tries.forEach(([w,b])=>{const li=document.createElement('li');li.innerHTML=`<b>1. ${w}?</b> fails to ${b}`;tl.appendChild(li);});
  $('triesBox').hidden=!puz.tries.length;
  $('solution').hidden=false;
}

async function load(){
  phase='loading';$('loading').hidden=false;$('solution').hidden=true;
  setStatus('Setting up a puzzle…');
  puz=await nextPuzzle();
  stats.count++;saveStats();
  $('loading').hidden=true;
  $('puzNo').textContent='#'+stats.count;
  $('lichess').href='https://lichess.org/analysis/'+puz.fen.replace(/ /g,'_');
  missed=false;hintSq=null;resetPos();
}

$('btnNext').onclick=()=>{if(busy)return;load();};
$('btnReset').onclick=()=>{if(phase==='loading'||busy)return;resetPos();};
$('btnHint').onclick=()=>{
  if(phase==='loading'||busy)return;
  miss();
  if(offPath){resetPos();hintSq=puz.key.from;render();setStatus('Your first move was off. This piece makes the right one.');return;}
  if(phase==='key'){hintSq=puz.key.from;setStatus('This piece makes the first move.');}
  else if(phase==='mate'){const m=mateIn1(game);if(m){hintSq=m.from;setStatus('This piece delivers mate.');}}
  render();
};
$('btnShow').onclick=()=>{if(phase==='loading')return;miss();showSolution();setStatus('Answer shown below.');if(phase!=='solved')phase='revealed';};
LEVELS.forEach(l=>$('lvl-'+l).onclick=()=>{
  if(l===level)return;level=l;showLevel();try{localStorage.setItem('m2level',l);}catch(_){}
  if(phase==='loading'){if(waiter){const b=buckets[level];if(b.length){const w=waiter;waiter=null;w.res(b.shift());}else waiter.level=level;}compose();}
  else if(!busy)load();
});
$('btnCopy').onclick=()=>{
  const t=puz?puz.fen:'';const btn=$('btnCopy');
  const done=()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy FEN',1200);};
  try{navigator.clipboard.writeText(t).then(done,()=>{btn.textContent=t;});}catch(e){btn.textContent=t;}
};

tally();
game=new Chess();game.clear();render();
compose();load();
})();
</script>
