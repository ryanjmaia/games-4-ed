<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loop Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF7E8">
<title>Loop Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2340; --cream:#FFF7E8; --coral:#FF6B6B; --sun:#FFC93C; --teal:#2EC4B6;
  --grape:#8E6CEF; --sky:#4D96FF; --leaf:#6BCB77; --pink:#FF8FC7; --soft:#F3EAD8; --mute:#7a7090;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
  background:var(--cream);
  background-image:radial-gradient(#e9dcc3 1.2px, transparent 1.2px); background-size:22px 22px;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.btn{
  font-weight:600; font-size:16px; border:3px solid var(--ink); border-radius:14px; background:#fff;
  padding:6px 12px; box-shadow:0 4px 0 var(--ink); cursor:pointer; line-height:1.1;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn:active,.btn.pressed{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn.on{background:var(--sun)}
.btn:disabled{opacity:.45; cursor:default}
.btn.sm{font-size:13px; padding:3px 8px; border-radius:10px; box-shadow:0 3px 0 var(--ink); border-width:2.5px}
.big{font-size:20px; padding:7px 13px; border-radius:16px}

header{display:flex; align-items:center; gap:7px; padding:10px 14px 8px; flex-wrap:wrap}
.logo{font-weight:700; font-size:20px; letter-spacing:.5px; display:flex; align-items:center; gap:8px; margin-right:4px}
.logo .blob{width:36px;height:36px;border-radius:12px;background:var(--coral);border:3px solid var(--ink);display:grid;place-items:center;font-size:19px;transform:rotate(-8deg)}
.group{display:flex; align-items:center; gap:6px; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:4px 8px}
.group label{font-weight:600; font-size:14px}
#playBtn.on{background:var(--leaf)}
#recBtn .dot{width:16px;height:16px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
#recBtn.on{background:var(--coral); color:#fff}
#recBtn.on .dot{background:#fff; animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(.6)}}
input[type=range]{accent-color:var(--grape); width:72px}
#bpmVal{font-weight:700; min-width:34px; text-align:center}
.seg{display:flex; gap:3px}
.seg .btn{padding:4px 6px; box-shadow:0 3px 0 var(--ink); font-size:15px}
.spacer{flex:1}
#midiPill{border:3px solid var(--ink); border-radius:999px; padding:5px 12px; font-weight:600; background:#fff; display:flex; align-items:center; gap:8px; cursor:pointer; font-size:15px; box-shadow:0 3px 0 var(--ink); white-space:nowrap}
#midiPill .light{width:14px;height:14px;border-radius:50%;background:#bbb;border:2px solid var(--ink)}
#midiPill.ok .light{background:var(--leaf); box-shadow:0 0 0 3px #6bcb7755}
#midiPill.warn .light{background:var(--sun)}
#midiPill.bad .light{background:var(--coral)}
#midiPill.hit .light{background:#fff}

main{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:12px; padding:2px 14px 8px}
.panel{min-width:0; background:#fff; border:3px solid var(--ink); border-radius:22px; padding:10px 12px; display:flex; flex-direction:column; min-height:0; box-shadow:0 5px 0 var(--ink)}
.panel h2{margin:0; font-size:20px; display:flex; align-items:center; gap:8px}
.ph{display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap}
.ph .btn{font-size:13px; padding:3px 8px; box-shadow:0 3px 0 var(--ink); border-radius:10px}

/* drums */
#drumGrid{flex:1; min-height:0; display:grid; grid-template-columns:128px repeat(16,1fr); grid-auto-rows:minmax(30px,1fr); gap:5px; align-content:stretch; padding:2px}
.dlabel{display:flex; align-items:stretch; border:3px solid var(--ink); border-radius:12px; overflow:hidden; background:#fff}
.dlabel .dplay{flex:1; display:flex; align-items:center; gap:5px; font-weight:600; font-size:14px; border:0; background:transparent; cursor:pointer; padding:0 5px; min-width:0; text-align:left}
.dlabel .dplay span{font-size:17px}
.dlabel .dplay b{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dlabel .dswap{border:0; border-left:2.5px solid var(--ink); background:#fff; cursor:pointer; font-size:15px; width:28px; padding:0; font-weight:700}
.dlabel .dswap:hover{background:var(--sun)}
.dlabel .dplay:active{transform:translateY(1px)}
.cell{border:2.5px solid var(--ink); border-radius:9px; background:#fff; cursor:pointer; min-height:20px; touch-action:none; transition:transform .06s}
.cell.beat{background:var(--soft)}
.cell.on{background:var(--c)}
.cell.now{transform:scale(1.12); box-shadow:0 0 0 3px var(--sun)}
.cell.on.now{filter:brightness(1.15)}

/* right panel */
.tabs{display:flex; gap:6px}
.tab{font-weight:700; font-size:18px; border:3px solid transparent; border-radius:12px; background:transparent; padding:2px 8px; cursor:pointer}
.tab.on{border-color:var(--ink); background:var(--sun)}
.tabs.single .tab{cursor:default; background:transparent; border-color:transparent; font-size:20px; padding:0}
#tracks{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding:2px}
.track{display:flex; align-items:center; gap:6px; border:3px solid var(--ink); border-radius:14px; padding:4px; background:#fff}
.track.rec{border-color:var(--coral); box-shadow:0 0 0 3px #ff6b6b55}
.track.muted canvas{opacity:.35}
.track canvas{flex:1; height:42px; min-width:0; border-radius:9px; background:var(--soft); display:block}
.track .tb{width:40px; height:40px; border:2.5px solid var(--ink); border-radius:11px; background:#fff; font-size:20px; cursor:pointer; display:grid; place-items:center; padding:0; flex:none}
.track .tb.inst{background:var(--c)}
.track .tb:active{transform:translateY(2px)}
.empty{flex:1; display:grid; place-items:center; text-align:center; color:var(--mute); font-size:17px; border:3px dashed #d8ccb4; border-radius:16px; padding:14px}

/* sound lab */
#lab{flex:1; min-height:0; overflow-y:auto; padding:0 4px 6px 2px}
.labHead{display:flex; align-items:center; gap:6px; flex-wrap:wrap; position:sticky; top:0; background:#fff; padding:2px 0 6px; z-index:2}
.chip{border:2.5px solid var(--ink); border-radius:999px; padding:2px 10px; font-weight:700; background:var(--c)}
.hint{font-size:13px; color:var(--mute); margin:0 0 6px}
.sec{border:2.5px solid var(--ink); border-radius:14px; padding:6px 10px 8px; margin-bottom:8px}
.sec h3{margin:0 0 4px; font-size:15px; display:flex; align-items:center; gap:6px}
.sec h3 small{font-weight:500; color:var(--mute); font-size:12px}
.sl{display:grid; grid-template-columns:78px 1fr 54px; align-items:center; gap:6px; font-size:13px; font-weight:500; min-height:24px}
.sl input{width:100%}
.sl output{text-align:right; font-variant-numeric:tabular-nums; color:var(--mute)}
.chs{display:flex; gap:4px; flex-wrap:wrap; margin:3px 0}
.chs button{font-size:12px; font-weight:600; border:2px solid var(--ink); border-radius:8px; background:#fff; padding:2px 7px; cursor:pointer}
.chs button.on{background:var(--sun)}
.oscBox{border-top:2px dashed #e2d6be; padding-top:4px; margin-top:4px}
.oscBox:first-of-type{border-top:0; margin-top:0}
.twoCol{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}

/* sounds row */
#soundsRow{display:flex; align-items:center; gap:8px; padding:0 14px 6px}
#soundsRow .lbl{font-weight:700; font-size:17px; white-space:nowrap}
#instBtns{flex:1; min-width:0; display:flex; gap:8px; overflow-x:auto; padding:6px 2px 8px; scrollbar-width:thin}
.cat{align-self:center; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--mute); writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap}
.inst{border:3px solid var(--ink); border-radius:16px; background:#fff; padding:4px 9px; cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:600; font-size:15px; box-shadow:0 4px 0 var(--ink); white-space:nowrap; flex:none}
.inst .e{font-size:20px}
.inst.sel{background:var(--c); transform:translateY(-3px); box-shadow:0 7px 0 var(--ink)}
.inst:active{transform:translateY(2px); box-shadow:0 2px 0 var(--ink)}

/* keyboard */
#kbWrap{height:clamp(110px,23vh,200px); padding:2px 14px 14px; display:flex; gap:10px}
.octBtn{width:54px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:13px}
.octBtn .btn{width:50px; height:46px; justify-content:center; font-size:22px; padding:0}
#keyboard{flex:1; position:relative; border:3px solid var(--ink); border-radius:18px; background:var(--ink); padding:6px; touch-action:none; box-shadow:0 5px 0 #000}
#whites{display:flex; height:100%; gap:4px}
.wk{flex:1; background:#fff; border-radius:0 0 10px 10px; position:relative; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding-bottom:6px; font-weight:600; font-size:14px; transition:background .05s}
.wk .stripe{width:70%; height:8px; border-radius:6px; background:var(--kc); margin-bottom:5px}
.wk .kl{font-size:11px; color:#9a90ad; font-weight:500}
.wk.down{background:var(--kc)}
.bk{position:absolute; top:6px; height:60%; background:#1d1730; border-radius:0 0 8px 8px; border:2px solid #000; z-index:2}
.bk.down{background:var(--kc)}

/* overlays */
.overlay{position:fixed; inset:0; background:#2b2340cc; display:grid; place-items:center; z-index:50}
.card{background:var(--cream); border:4px solid var(--ink); border-radius:26px; padding:22px 26px; box-shadow:0 8px 0 var(--ink); max-width:min(640px,94vw); max-height:88vh; overflow:auto}
#modalCard{width:min(660px,94vw)}
.card h1{margin:0 0 6px; font-size:40px}
.card h2{margin:0 0 8px}
.card p{font-size:17px; line-height:1.4; margin:8px 0}
.hidden{display:none !important}
#countIn{position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; z-index:40; font-size:180px; font-weight:700; color:var(--coral); -webkit-text-stroke:5px var(--ink)}
#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:14px; font-weight:600; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center}
#toast.show{opacity:1}
.songList{display:flex; flex-direction:column; gap:6px; margin:10px 0}
.songItem{display:flex; align-items:center; gap:8px; background:#fff; border:3px solid var(--ink); border-radius:14px; padding:6px 8px}
.songItem b{flex:1}
.textIn{font:inherit; font-size:18px; border:3px solid var(--ink); border-radius:12px; padding:6px 10px; width:100%}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
kbd{background:#fff; border:2px solid var(--ink); border-radius:6px; padding:0 5px; font-family:inherit}
.pgroup{margin:8px 0 4px; font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--mute)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:7px}
.pick{border:3px solid var(--ink); border-radius:13px; background:#fff; padding:6px 8px; cursor:pointer; font-weight:600; font-size:15px; display:flex; align-items:center; gap:6px; text-align:left}
.pick span{font-size:19px}
.pick.sel{background:var(--c); box-shadow:0 0 0 3px var(--sun)}
.exp{display:flex; align-items:center; gap:12px; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:10px 12px; margin:8px 0; cursor:pointer; text-align:left; width:100%; box-shadow:0 4px 0 var(--ink)}
.exp:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.exp .ic{font-size:30px}
.exp b{font-size:18px; display:block}
.exp small{font-size:14px; color:var(--mute)}
.exp:disabled{opacity:.5}

button{touch-action:manipulation}
#pageSeg,#phoneNav{display:none}
#fxGroup{display:flex; gap:8px; align-items:center}
main{grid-template-rows:minmax(0,1fr)}
body.phone #fxGroup{order:7; gap:5px; margin-left:auto}
.presets{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
@media (max-width:1340px){ #tempoGroup .t, #songsBtn .t{display:none} }
/* ===== phone layout ===== */
body.phone{height:100vh; height:100dvh}
body.phone header{padding:6px 8px 4px; gap:5px}
body.phone header .spacer{display:none}
body.phone .t{display:none}
body.phone .logo{margin:0; order:0}
body.phone .logo{font-size:0}
body.phone .logo .blob{width:30px; height:30px; font-size:15px}
body.phone header > .group:nth-of-type(1){order:1}
body.phone #undoBtn{order:2; margin-left:auto}
body.phone #songsBtn{order:3}
body.phone #tempoGroup{order:4; flex:1 1 110px}
body.phone #tempoGroup input{flex:1; width:auto; min-width:50px}
body.phone #loopGroup{order:5}
body.phone #snapGroup{order:6}
body.phone #volGroup{display:none}
body.phone .group{padding:3px 5px; border-width:2.5px; border-radius:14px}
body.phone .btn{font-size:15px; padding:5px 9px}
body.phone .big{font-size:17px; padding:6px 11px}
body.phone .seg .btn{padding:3px 6px; font-size:14px}
body.phone main{grid-template-columns:minmax(0,1fr); padding:2px 8px 6px; gap:0}
body.phone[data-view=beat] #rightPanel{display:none}
body.phone:not([data-view=beat]) #beatPanel{display:none}
body.phone #tabs{display:none}
body.phone .panel{min-width:0; padding:8px; border-radius:18px; box-shadow:0 4px 0 var(--ink)}
body.phone .ph{flex-wrap:nowrap; margin-bottom:6px}
body.phone .ph h2{font-size:18px}
body.phone #pageSeg{display:flex}
body.phone #beatHead .spacer{display:none}
body.phone .presets{flex-wrap:nowrap; overflow-x:auto; flex:1; min-width:0; padding:2px 2px 6px}
body.phone .presets .btn{flex:none}
body.phone #drumGrid{grid-template-columns:52px repeat(8,1fr); gap:4px; grid-auto-rows:minmax(28px,1fr)}
body.phone #drumGrid.page0 .h1, body.phone #drumGrid.page1 .h0{display:none}
body.phone .dlabel{border-width:2.5px; border-radius:10px}
body.phone .dlabel .dplay{justify-content:center; padding:0}
body.phone .dlabel .dplay b{display:none}
body.phone .dlabel .dswap{width:20px; font-size:12px; border-left-width:2px}
body.phone #pageSeg .btn.live{box-shadow:0 0 0 3px var(--coral)}
body.phone .track .tb{width:34px; height:34px; font-size:17px}
body.phone .track canvas{height:36px}
body.phone #soundsRow{padding:0 8px 2px; gap:5px}
body.phone #soundsRow .lbl{display:none}
body.phone #instBtns{gap:6px; padding:5px 2px 7px}
body.phone .inst{font-size:13px; padding:3px 7px; border-radius:13px}
body.phone .inst .e{font-size:17px}
body.phone .cat{font-size:9px}
body.phone #midiPill{padding:5px 8px; font-size:14px}
body.phone #midiText{display:none}
body.phone #kbWrap{height:clamp(100px,21vh,170px); padding:2px 8px 6px; gap:5px}
body.phone .octBtn{width:32px}
body.phone .octBtn span{display:none}
body.phone .octBtn .btn{width:32px; height:44px; font-size:15px; border-radius:11px}
body.phone #keyboard{padding:4px; border-radius:14px}
body.phone #whites{gap:3px}
body.phone .wk{font-size:13px; padding-bottom:4px}
body.phone .wk .kl{display:none}
body.phone #phoneNav{display:flex; gap:6px; padding:0 8px calc(8px + env(safe-area-inset-bottom))}
body.phone #phoneNav .btn{flex:1; justify-content:center; font-size:15px; padding:7px 4px}
body.phone #phoneNav .btn.on{background:var(--sun)}
body.phone .twoCol{grid-template-columns:1fr}
body.phone .sl{grid-template-columns:70px 1fr 48px}
body.phone .card{padding:14px 14px; border-radius:20px}
body.phone .card h1{font-size:32px}
body.phone .card h2{font-size:20px}
body.phone .pgrid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:6px}
body.phone .pick{font-size:14px; padding:5px 6px}
body.phone #countIn{font-size:120px}
body.phone #toast{bottom:auto; top:42%}
body.phone .exp{padding:8px 10px}
body.phone .exp .ic{font-size:24px}
body.phone .exp b{font-size:16px}
/* short landscape phones */
body.phone.short header{flex-wrap:nowrap; overflow-x:auto}
body.phone.short #kbWrap{height:clamp(84px,24vh,120px)}
body.phone.short #drumGrid{grid-auto-rows:30px; overflow-y:auto; align-content:start}
body.phone.short #phoneNav .btn{padding:4px; font-size:14px}
body.phone.short #phoneNav{padding-bottom:6px}
body.phone.short .ph{margin-bottom:4px}
body.phone.short .presets .btn,body.phone.short #pageSeg .btn{padding:2px 7px; font-size:13px}

.barRow{display:flex; align-items:center; gap:6px; margin:-2px 0 8px; flex-wrap:wrap}
.barRow .lbl{font-weight:600; font-size:13px; color:var(--mute); white-space:nowrap}
.barRow .seg .btn{padding:2px 7px; font-size:13px; border-width:2.5px; border-radius:9px; box-shadow:0 2px 0 var(--ink)}
#barTools{display:flex; align-items:center; gap:6px; flex:1; min-width:0; flex-wrap:nowrap}
.divider{width:2px; align-self:stretch; background:#e2d6be; border-radius:2px; margin:0 2px}
#barStrip{display:flex; gap:3px; overflow-x:auto; min-width:0; flex:0 1 auto; padding:3px 2px; scrollbar-width:thin}
.barBtn{min-width:24px; height:24px; border:2px solid var(--ink); border-radius:7px; background:#fff; font-size:12px; font-weight:700; cursor:pointer; padding:0 3px; position:relative; flex:none}
.barBtn.has::after{content:''; position:absolute; left:50%; bottom:2px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--grape)}
.barBtn.sel{background:var(--sun)}
.barBtn.live{box-shadow:0 0 0 2.5px var(--coral)}
body.phone .barRow{margin:-2px 0 6px; gap:4px; flex-wrap:wrap}
body.phone #barTools .divider{display:none}
body.phone #barTools{flex-basis:100%}
body.phone #barTools{flex-wrap:nowrap; gap:4px}
body.phone .barBtn{min-width:22px; height:24px}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="blob">🎵</div>Loop Lab</div>
  <div class="group">
    <button class="btn big" id="playBtn" title="Play / Stop (space bar)">▶ Play</button>
    <button class="btn big" id="recBtn" title="Record what you play (R)"><span class="dot"></span>Record</button>
  </div>
  <div class="group" id="tempoGroup">
    <label class="t">🐢</label>
    <input type="range" id="bpm" min="60" max="160" value="100">
    <label class="t">🐇</label>
    <span id="bpmVal">100</span>
  </div>
  <div class="group" id="loopGroup" title="How many bars long your recorded layers are. The beat has its own length, under the Beat style buttons.">
    <label>🎼<span class="t"> Layers</span></label>
    <div class="seg" id="barsSeg">
      <button class="btn" data-b="1">1</button><button class="btn on" data-b="2">2</button><button class="btn" data-b="4">4</button><button class="btn" data-b="8">8</button>
    </div>
  </div>
  <div class="group" id="snapGroup">
    <button class="btn on" id="snapBtn" title="Magic Snap moves your notes onto the beat">🧲<span class="t"> Snap</span></button>
    <button class="btn on" id="clickBtn" title="Tick-tock beat while recording">⏱</button>
  </div>
  <div class="spacer"></div>
  <div class="group" id="volGroup" title="Volume"><label>🔊</label><input type="range" id="vol" min="0" max="100" value="80" style="width:48px"></div>
  <button class="btn" id="undoBtn" title="Undo">↩</button>
  <button class="btn" id="songsBtn">📁<span class="t"> Songs</span></button>
</header>

<main>
  <section class="panel" id="beatPanel">
    <div class="ph" id="beatHead">
      <h2>🥁<span class="t"> Beat</span></h2>
      <div class="seg" id="pageSeg"><button class="btn on" data-pg="0">1–8</button><button class="btn" data-pg="1">9–16</button></div>
      <div class="spacer"></div>
      <div class="presets">
      <button class="btn" data-preset="rock">Rock</button>
      <button class="btn" data-preset="hiphop">Hip-Hop</button>
      <button class="btn" data-preset="house">House</button>
      <button class="btn" data-preset="techno">Techno</button>
      <button class="btn" data-preset="edm">EDM</button>
      <button class="btn" data-preset="latin">Latin</button>
      <button class="btn" data-preset="surprise">🎲</button>
      <button class="btn" data-preset="clear" title="Clear the beat">🧽</button>
      </div>
    </div>

  if (P.noise > 0){
    const n = ctx.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const g = ctx.createGain(); g.gain.value = P.noise*.4; n.connect(g); g.connect(filt); n.start(t); srcs.push(n);
  }
  if (P.lfoPitch > 0 || P.lfoFilt > 0 || P.lfoAmp > 0){
    const lfo = ctx.createOscillator(); lfo.frequency.value = lfoHz(P);
    if (P.lfoPitch > 0){ const g = ctx.createGain(); g.gain.value = P.lfoPitch; lfo.connect(g); srcs.forEach(o => o.detune && g.connect(o.detune)); }
    if (P.lfoFilt > 0){ const g = ctx.createGain(); g.gain.value = P.lfoFilt; lfo.connect(g); g.connect(filt.frequency); }
    if (P.lfoAmp > 0){ trem.gain.value = 1 - P.lfoAmp/2; const g = ctx.createGain(); g.gain.value = P.lfoAmp/2; lfo.connect(g); g.connect(trem.gain); }
    lfo.start(t); srcs.push(lfo);
  }
  if (!srcs.length) add('sine', mtof(base), 0, 0.0001);
  const autoEnd = P.s === 0 ? t + P.a + P.d*7 + .05 : null;
  if (autoEnd) srcs.forEach(o => o.stop(autoEnd));
  srcs[0].onended = () => { try { trem.disconnect(); } catch(e){} };
  return {
    stop(t2){
      t2 = Math.max(t2, ctx.currentTime);
      const g = env.gain;
      if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t2);
      else { g.cancelScheduledValues(t2); g.setValueAtTime(g.value, t2); }
      g.setTargetAtTime(0, t2, Math.max(.005, P.r/3));
      const end = t2 + P.r*2.5 + .02;
      srcs.forEach(o => { try { o.stop(autoEnd ? Math.min(end, autoEnd) : end); } catch(e){} });
    }
  };
}

/* ---- drums ---- */
function noiseSrc(t, dur){ const n = ctx.createBufferSource(); n.buffer = noiseBuf; n.start(t); n.stop(t + dur + .02); return n; }
function eg(t, peak, dec){ const g = ctx.createGain(); g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(.001, t + dec); return g; }
function bq(type, f, q){ const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = clamp(f, 20, 20000); if (q != null) b.Q.value = q; return b; }
function osc(type, f, t, dur){ const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur + .02); return o; }
function chain(...nodes){ for (let i = 0; i < nodes.length-1; i++) nodes[i].connect(nodes[i+1]); return nodes[nodes.length-1]; }
function metallic(t, dur, p, out, peak, bpf){
  const g = eg(t, peak, dur), bp = bq('bandpass', bpf*p, .8), hp = bq('highpass', 7000*p);
  [205.3, 304.4, 369.6, 522.7, 540, 800].forEach(f => osc('square', f*p*1.7, t, dur).connect(bp));
  chain(bp, hp, g, out);
}
const DRUM_FX = {
  kick(t,o,p,d){ const s = osc('sine',160*p,t,.5*d); s.frequency.exponentialRampToValueAtTime(42*p, t+.13*d); chain(s, eg(t,1.1,.45*d), o); },
  snare(t,o,p,d){ chain(noiseSrc(t,.25*d), bq('highpass',1200*p), eg(t,.7,.2*d), o);
    const s = osc('triangle',220*p,t,.15*d); s.frequency.exponentialRampToValueAtTime(150*p, t+.1); chain(s, eg(t,.6,.12*d), o); },
  clap(t,o,p,d){ const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
    [0,.012,.024].forEach(dt => { g.gain.setValueAtTime(.9, t+dt); g.gain.exponentialRampToValueAtTime(.12, t+dt+.01); });
    g.gain.setValueAtTime(.7, t+.035); g.gain.exponentialRampToValueAtTime(.001, t+.035+.19*d);
    chain(noiseSrc(t,.3*d), bq('bandpass',1400*p,1.2), g, o); },
  hat(t,o,p,d){ chain(noiseSrc(t,.08*d), bq('highpass',7500*p), eg(t,.45,.05*d), o); },
  ohat(t,o,p,d){ chain(noiseSrc(t,.5*d), bq('highpass',7000*p), eg(t,.35,.38*d), o); },
  shaker(t,o,p,d){ const g = ctx.createGain(); g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.4,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.02+.08*d);
    chain(noiseSrc(t,.15*d), bq('bandpass',6500*p,1.5), g, o); },
  crash(t,o,p,d){ chain(noiseSrc(t,1.6*d), bq('highpass',3500*p), eg(t,.45,1.5*d), o); },
  tomhi(t,o,p,d){ const s = osc('sine',260*p,t,.35*d); s.frequency.exponentialRampToValueAtTime(170*p,t+.25*d); chain(s, eg(t,.8,.3*d), o); },
  tomlo(t,o,p,d){ const s = osc('sine',150*p,t,.5*d); s.frequency.exponentialRampToValueAtTime(90*p,t+.25*d); chain(s, eg(t,.8,.45*d), o); },
  rim(t,o,p,d){ chain(osc('square',1700*p,t,.06*d), bq('bandpass',2000*p,3), eg(t,.6,.04*d), o); },
  wood(t,o,p,d){ const s = osc('triangle',1050*p,t,.1*d); s.frequency.exponentialRampToValueAtTime(900*p,t+.05); chain(s, eg(t,.7,.09*d), o); },
  bell(t,o,p,d){ const bp = bq('bandpass',900*p,2); osc('square',540*p,t,.32*d).connect(bp); osc('square',800*p,t,.32*d).connect(bp); chain(bp, eg(t,.5,.3*d), o); },
  clave(t,o,p,d){ chain(osc('sine',2500*p,t,.07*d), eg(t,.6,.05*d), o); },
  kick909(t,o,p,d){ const s = osc('sine',230*p,t,.4*d); s.frequency.exponentialRampToValueAtTime(52*p, t+.07); chain(s, eg(t,1.2,.38*d), o);
    chain(noiseSrc(t,.01), bq('highpass',2000), eg(t,.35,.008), o); },
  kickhard(t,o,p,d){ const s = osc('sine',190*p,t,.6*d); s.frequency.exponentialRampToValueAtTime(48*p, t+.09);
    const ws = ctx.createWaveShaper(); ws.curve = shaperCurve; const out = ctx.createGain(); out.gain.value = .6;
    chain(s, eg(t,1,.55*d), ws, bq('lowpass',2600), out, o); },
  sub(t,o,p,d){ const s = osc('sine',70*p,t,1.15*d); s.frequency.exponentialRampToValueAtTime(45*p,t+.3); chain(s, eg(t,1,1.1*d), o); },
  snare909(t,o,p,d){ chain(noiseSrc(t,.3*d), bq('highpass',1800*p), eg(t,.8,.25*d), o);
    [180,330].forEach(f => chain(osc('triangle',f*p,t,.12*d), eg(t,.45,.1*d), o)); },
  clap909(t,o,p,d){ const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
    [0,.01,.02,.03].forEach(dt => { g.gain.setValueAtTime(1, t+dt); g.gain.exponentialRampToValueAtTime(.15, t+dt+.009); });
    g.gain.setValueAtTime(.8, t+.04); g.gain.exponentialRampToValueAtTime(.001, t+.04+.4*d);
    chain(noiseSrc(t,.5*d), bq('bandpass',1100*p,.8), g, o); },
  hat909(t,o,p,d){ metallic(t, .06*d, p, o, .35, 10000); },
  ohat909(t,o,p,d){ metallic(t, .45*d, p, o, .3, 10000); },
  ride(t,o,p,d){ metallic(t, 1.0*d, p*.8, o, .2, 6000); chain(noiseSrc(t,.6*d), bq('highpass',8000*p), eg(t,.08,.5*d), o); },
  zap(t,o,p,d){ const s = osc('sawtooth',2200*p,t,.22*d); s.frequency.exponentialRampToValueAtTime(90*p,t+.18*d); chain(s, eg(t,.22,.2*d), o); },
  blip(t,o,p,d){ chain(osc('sine',800*p,t,.14*d), eg(t,.55,.12*d), o); },
  whoosh(t,o,p,d){ const dur = .9*d, b = bq('bandpass',300*p,4); b.frequency.exponentialRampToValueAtTime(9000*p, t+dur*.85);
    const g = ctx.createGain(); g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.6,t+dur*.8); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    chain(noiseSrc(t,dur), b, g, o); },
  stab(t,o,p,d){ const lp = bq('lowpass',3000,3); lp.frequency.setValueAtTime(3000,t); lp.frequency.exponentialRampToValueAtTime(500,t+.2*d);
    [0,3,7,10].forEach(i => osc('sawtooth', mtof(60+i)*p, t, .32*d).connect(lp)); chain(lp, eg(t,.16,.3*d), o); }
};
function playDrum(id, t, vol=1, pitch=0, dec=1){
  const fx = DRUM_FX[id]; if (!fx || vol <= 0) return;
  const out = ctx.createGain(); out.gain.value = vol; out.connect(drumBus);
  fx(t, out, Math.pow(2, pitch/12), dec);
}
const playRow = (r, t) => playDrum(r.s, t, r.vol, r.pitch, r.dec);
function click(t, accent){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = accent ? 1800 : 1200;
  g.gain.setValueAtTime(accent ? .35 : .2, t); g.gain.exponentialRampToValueAtTime(.001, t+.05);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.06);
}

/* ================= transport ================= */
let playing = false, nextStepTime = 0, absStep = 0, timer = null;
let recording = false, recTrack = null, pendingRec = {};
let exportMode = false;
const stepDur = () => 60/song.bpm/4;
const totalSteps = () => song.bars*16;
const beatSteps = () => (song.beatBars || 1)*16;
const songSteps = () => Math.max(totalSteps(), beatSteps());
const posAbs = now => absStep - (nextStepTime - now)/stepDur();

function startPlayback(countIn){
  initAudio();
  if (playing) return;
  playing = true;
  absStep = countIn ? -16 : 0;
  nextStepTime = ctx.currentTime + .08;
  timer = setInterval(scheduler, 25);
  scheduler();
  updateTransportUI();
}
function stopPlayback(){
  if (!playing) return;
  if (recording) stopRecording();
  playing = false; clearInterval(timer); timer = null;
  $('#countIn').classList.add('hidden');
  updateTransportUI();
}
function scheduler(){
  while (nextStepTime < ctx.currentTime + .12){
    scheduleStep(absStep, nextStepTime);
    nextStepTime += stepDur(); absStep++;
  }
}
function scheduleStep(abs, t){
  const sd = stepDur();
  if (abs < 0){ if (abs % 4 === 0) click(t, abs === -16); return; }
  const T = totalSteps(), s = abs % T, ds = abs % beatSteps(), bs = abs % 16;
  if (abs % 2 === 1) t += song.swing*sd;
  song.rows.forEach(r => { if (r.steps[ds]) playRow(r, t); });
  if (metro && recording && bs % 4 === 0) click(t, bs === 0);
  song.tracks.forEach(tr => {
    if (tr.muted) return;
    tr.notes.forEach(n => {
      if (Math.floor(n.start) === s && n.skipAbs !== abs){
        const t0 = t + (n.start - s)*sd;
        startVoice(tr.inst, n.midi, n.vel, t0).stop(t0 + n.dur*sd);
      }
    });
  });
}

/* ================= recording ================= */
function startRecording(){
  initAudio();
  if (song.tracks.length >= 8){ toast('That’s 8 layers! Delete one to record more.'); return; }
  pushUndo();
  recTrack = {id:trackIdSeq++, inst:curInst, notes:[], muted:false};
  song.tracks.push(recTrack);
  recording = true; pendingRec = {};
  if (!playing) startPlayback(true);
  showTab(false); if (isPhone) setView('layers'); renderTracks(); updateTransportUI();
}
function stopRecording(){
  if (!recording) return;
  Object.keys(pendingRec).forEach(m => recNoteOff(+m));
  recording = false;
  if (recTrack && recTrack.notes.length === 0){
    song.tracks = song.tracks.filter(t => t !== recTrack);
  } else if (recTrack){
    recTrack.notes.forEach(n => delete n.skipAbs);
    toast('Nice! Layer saved 🎉');
  }
  recTrack = null; renderTracks(); updateTransportUI(); autosave();
}
function recNoteOn(midi, vel){
  let pa = posAbs(ctx.currentTime);
  if (pa < -1.5) return;
  if (pa < 0) pa = 0;
  const T = totalSteps();
  const startAbs = snap ? Math.round(pa/2)*2 : pa;
  const n = {midi, vel, start: ((startAbs % T) + T) % T, dur: 1};
  if (Math.floor(startAbs) >= absStep) n.skipAbs = Math.floor(startAbs);
  recTrack.notes.push(n);
  pendingRec[midi] = {n, pa};
}
function recNoteOff(midi){
  const p = pendingRec[midi]; if (!p) return;
  let d = posAbs(ctx.currentTime) - p.pa;
  d = Math.max(.5, Math.min(d, totalSteps()));
  if (snap) d = Math.max(1, Math.round(d));
  p.n.dur = d; delete pendingRec[midi];
}

/* ================= live notes ================= */
const live = new Map(); let sustain = false; const sustained = new Set();
function noteOn(midi, vel=100){
  initAudio();
  if (live.has(midi)) releaseVoice(midi);
  live.set(midi, startVoice(curInst, midi, vel, ctx.currentTime));
  setKey(midi, true);
  if (recording) recNoteOn(midi, vel);
}
function noteOff(midi){
  setKey(midi, false);
  if (!live.has(midi)) return;
  if (sustain){ sustained.add(midi); return; }
  releaseVoice(midi);
}
function releaseVoice(midi){
  const v = live.get(midi); if (!v) return;
  v.stop(ctx.currentTime); live.delete(midi); sustained.delete(midi);
  if (recording) recNoteOff(midi);
}
function setSustain(on){ sustain = on; if (!on) [...sustained].forEach(releaseVoice); }
function allNotesOff(){ sustain = false; [...live.keys()].forEach(m => { setKey(m,false); releaseVoice(m); }); }

/* ================= on-screen keyboard ================= */
const keyEls = new Map();
function buildKeyboard(){
  const whites = $('#whites'); whites.innerHTML = ''; $$('.bk').forEach(b => b.remove()); keyEls.clear();
  const kb = $('#keyboard');
  const revMap = {}; Object.entries(KEYMAP).forEach(([k,o]) => revMap[o] = k.toUpperCase());
  const notes = []; const k0 = isPhone ? baseNote + 12 : baseNote; for (let m = k0; m <= baseNote+24; m++) notes.push(m);
  notes.filter(m => ![1,3,6,8,10].includes(m%12)).forEach(m => {
    const el = document.createElement('div'); el.className = 'wk'; el.dataset.m = m;
    el.style.setProperty('--kc', NOTE_COL[m%12]);
    const label = NOTE_NAMES[m%12] + (m%12===0 ? Math.floor(m/12)-1 : '');
    const k = revMap[m - baseNote - 12];
    el.innerHTML = `<div class="stripe"></div>${label}${k ? `<span class="kl">${k}</span>` : ''}`;
    whites.appendChild(el); keyEls.set(m, el);
  });
  requestAnimationFrame(() => {
    const ww = whites.firstChild.getBoundingClientRect().width, kbr = kb.getBoundingClientRect();

      el.style.setProperty('--kc', NOTE_COL[m%12]);
      const w = ww*.6;
      el.style.width = w+'px'; el.style.left = (left.right - kbr.left - 1 - w/2)+'px';
      kb.appendChild(el); keyEls.set(m, el);
    });
    live.forEach((_, m) => setKey(m, true));
  });
}
function setKey(m, down){ const el = keyEls.get(m); if (el) el.classList.toggle('down', down); }
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(buildKeyboard, 80); });

const ptrNotes = new Map();
function keyAt(x, y){ const el = document.elementFromPoint(x, y); const k = el && el.closest('.wk,.bk'); return k ? +k.dataset.m : null; }
const kbEl = $('#keyboard');
kbEl.addEventListener('pointerdown', e => {

});

  if (!ptrNotes.has(e.pointerId)) return;
  const m = keyAt(e.clientX, e.clientY), old = ptrNotes.get(e.pointerId);

});
const ptrEnd = e => { const m = ptrNotes.get(e.pointerId); if (m != null) noteOff(m); ptrNotes.delete(e.pointerId); };
kbEl.addEventListener('pointerup', ptrEnd); kbEl.addEventListener('pointercancel', ptrEnd);

function shiftOct(d){
  const nb = baseNote + d*12; if (nb < 24 || nb > 84) return;
  allNotesOff(); baseNote = nb; buildKeyboard();
}
$('#octDown').onclick = () => shiftOct(-1);
$('#octUp').onclick = () => shiftOct(1);

const heldKeys = new Map();
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && (e.target.type === 'text')) return;
  if (!$('#modal').classList.contains('hidden')) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space'){ e.preventDefault(); if (!e.repeat) togglePlay(); return; }
  if (e.repeat){ if (k in KEYMAP) e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === 'z') return shiftOct(-1);
  if (k === 'x') return shiftOct(1);
  if (k === 'r') return $('#recBtn').click();
  if (k in KEYMAP){
    e.preventDefault();
    if (document.activeElement && document.activeElement.type === 'range') document.activeElement.blur();
    const m = baseNote + 12 + KEYMAP[k]; heldKeys.set(k, m); noteOn(m, 100);
  }
});

  const k = e.key.toLowerCase();
  if (heldKeys.has(k)){ noteOff(heldKeys.get(k)); heldKeys.delete(k); }

/* ================= MIDI input ================= */
let midiAccess = null;
function setMidi(state, text){ const p = $('#midiPill'); p.className = state; $('#midiText').textContent = text; }
async function connectMIDI(quiet){
  if (!navigator.requestMIDIAccess){ if (!quiet) setMidi('bad', 'MIDI needs Chrome'); return; }
  try {
    midiAccess = await navigator.requestMIDIAccess({sysex:false});
    midiAccess.onstatechange = refreshInputs;
    refreshInputs();
  } catch(err){
    if (quiet) setMidi('warn', 'Connect keyboard');
    else { setMidi('bad', 'Keyboard blocked'); showMidiHelp(); }
  }
}
function refreshInputs(){
  const ins = [...midiAccess.inputs.values()].filter(i => i.state !== 'disconnected');
  ins.forEach(i => i.onmidimessage = onMidi);
  if (ins.length) setMidi('ok', '🎹 ' + shortName(ins[0].name) + (ins.length > 1 ? ` +${ins.length-1}` : ''));
  else setMidi('warn', 'Plug in a keyboard');
}
const shortName = n => (n || 'Keyboard').replace(/\s*(MIDI|Port)\s*\d*$/i,'').slice(0,18);
let hitT = null;
function onMidi(e){
  const [st, d1, d2] = e.data, cmd = st & 0xf0;
  if (cmd === 0x90 && d2 > 0){ noteOn(d1, d2); blink(); }
  else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) noteOff(d1);
  else if (cmd === 0xB0){
    if (d1 === 64) setSustain(d2 >= 64);
    else if (d1 === 120 || d1 === 123) allNotesOff();
  }
}
function blink(){ const p = $('#midiPill'); p.classList.add('hit'); clearTimeout(hitT); hitT = setTimeout(() => p.classList.remove('hit'), 80); }

  <p>1. Plug the MIDI keyboard into the Chromebook with its USB cable.</p>
  <p>2. Click the keyboard button again. If Chrome asks to use MIDI devices, click <b>Allow</b>.</p>
  <p>3. If it still says blocked, this page is probably inside another page that isn't allowed to use MIDI. Open the downloaded Loop Lab file in Chrome and try again.</p>
  <p style="font-size:15px;color:var(--mute)">You can always play with the on-screen keys or your computer keys meanwhile.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Got it</button></div>`);
}
$('#midiPill').onclick = () => { initAudio(); connectMIDI(false); };

function setCell(ri, i, v){

  if (v && !playing) playRow(song.rows[ri], ctx.currentTime);
}
$$('[data-preset]').forEach(b => b.onclick = () => {
  initAudio(); pushUndo(); const p = b.dataset.preset;
  if (p === 'clear') song.rows.forEach(r => r.steps.fill(0));
  else if (p === 'surprise'){
    const L = beatSteps();
    song.rows.forEach(r => {
      const role = DRUM_BY[r.s].role, pr = ROLE_PROB[role] || ROLE_PROB.perc;
      const base = Array.from({length:16}, (_, i) => Math.random() < pr[i%4] ? 1 : 0);
      if (role === 'kick') base[0] = 1;
      if (role === 'snare'){ base[4] = 1; base[12] = 1; }
      if (role === 'cym') base[0] = Math.random() < .6 ? 1 : 0;
      r.steps = Array.from({length:L}, (_, i) => {
        const b = Math.floor(i/16), j = i % 16;
        if (b > 0 && (role === 'hat' || role === 'perc' || role === 'fx') && Math.random() < .12) return base[j] ? 0 : 1;
        return base[j];
      });
    });
    addFills();
  } else {
    song.rows = BEATS[p].map(([id, pat]) => mkRow(id, pat, null, beatSteps()));
    addFills();
  }
  buildDrums(); autosave();
  if (!playing) startPlayback(false);
});

// Longer beats: crash only at the start of each 4-bar phrase, and a little drum fill at the end
function addFills(){
  const nb = song.beatBars; if (nb < 2) return;
  song.rows.forEach(r => {
    if (DRUM_BY[r.s].role === 'cym') for (let b = 0; b < nb; b++) if (b % 4) r.steps[b*16] = 0;
  });
  const fillRow = song.rows.find(r => DRUM_BY[r.s].role === 'snare') || song.rows.find(r => DRUM_BY[r.s].role === 'perc');
  if (!fillRow) return;
  for (let b = 3; b < nb; b += 4) [12,13,14,15].forEach(j => fillRow.steps[b*16 + j] = 1);
  if (nb === 2) [13,14,15].forEach(j => fillRow.steps[16 + j] = 1);
}
let viewBar = 0, follow = true;
function renderBarStrip(){
  const nb = song.beatBars;
  $$('#beatLenSeg .btn').forEach(b => b.classList.toggle('on', +b.dataset.bl === nb));
  $('#barTools').classList.toggle('hidden', nb < 2);

function goBar(b){
  viewBar = clamp(b, 0, song.beatBars - 1); lastCol = -1;
  gridRefs.forEach(ref => ref.cells.forEach(c => c.classList.remove('now')));
  refreshDrums();
  const sel = $('#barStrip .sel'); if (sel) sel.scrollIntoView({block:'nearest', inline:'nearest'});
}
function setFollow(on){ follow = on; $('#followBtn').classList.toggle('on', on); }
function setBeatBars(nb){
  if (nb === song.beatBars) return;
  const oldL = beatSteps(), newL = nb*16;
  const apply = () => {
    pushUndo();
    song.rows.forEach(r => { r.steps = Array.from({length: newL}, (_, i) => newL > oldL ? r.steps[i % oldL] : r.steps[i]); });
    song.beatBars = nb; if (viewBar >= nb) viewBar = 0;
    goBar(viewBar); autosave();
    if (nb > oldL/16) toast(`Beat is now ${nb} bars. New bars start as copies, so change them up!`);
  };
  const lost = newL < oldL && song.rows.some(r => r.steps.slice(newL).some(Boolean));
  if (lost) confirmModal(`Making the beat ${nb} bar${nb > 1 ? 's' : ''} long removes bars ${nb+1}–${oldL/16}. Keep going?`, 'Make it shorter', apply);
  else apply();
}

function renderTracks(){
  const box = $('#tracks'); box.innerHTML = '';
  if (!song.tracks.length){
    box.innerHTML = `<div class="empty"><div><div style="font-size:38px">🎤</div>Pick a sound, press <b>● Record</b>,<br>and play something on the keyboard.<br>Each recording becomes a new layer!</div></div>`;
    return;
  }
  song.tracks.forEach(tr => {
    const I = getInst(tr.inst), row = document.createElement('div');
    row.className = 'track' + (tr === recTrack ? ' rec' : '') + (tr.muted ? ' muted' : '');
    row.innerHTML = `<button class="tb inst" title="${esc(I.name)} (click to change)" style="--c:${I.c}">${I.e}</button><canvas></canvas>
      <button class="tb mute" title="Mute">${tr.muted ? '🔇' : '🔊'}</button><button class="tb del" title="Delete layer">🗑</button>`;
    row.querySelector('.inst').onclick = () => openSoundPicker(tr.inst, k => { pushUndo(); tr.inst = k; renderTracks(); autosave(); });
    row.querySelector('.mute').onclick = () => { tr.muted = !tr.muted; renderTracks(); autosave(); };
    row.querySelector('.del').onclick = () => {
      if (tr === recTrack) stopRecording();
      pushUndo(); song.tracks = song.tracks.filter(t => t !== tr); renderTracks(); autosave();
    };
    tr._cv = row.querySelector('canvas');
    box.appendChild(row);
  });
}
function drawTrack(tr, playPos){
  const cv = tr._cv; if (!cv || !cv.isConnected || !cv.offsetParent) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const T = totalSteps(), sx = w/T;
  g.fillStyle = '#e2d4b8';
  for (let b = 1; b < song.bars; b++) g.fillRect(b*16*sx, 0, 2, h);
  if (song.bars <= 4){ g.fillStyle = '#ece0c8'; for (let q = 4; q < T; q += 4) if (q % 16) g.fillRect(q*sx, 0, 1, h); }
  let lo = 127, hi = 0; tr.notes.forEach(n => { lo = Math.min(lo, n.midi); hi = Math.max(hi, n.midi); });
  if (lo > hi){ lo = 60; hi = 72; }
  const mid = (lo+hi)/2, span = Math.max(14, hi-lo+4); lo = mid - span/2;
  const nh = Math.max(4, Math.min(9, h/span*1.5));
  const c = getInst(tr.inst).c;
  tr.notes.forEach(n => {
    const x = n.start*sx, y = h - ((n.midi - lo)/span)*h - nh/2, ww = Math.max(3, Math.min(n.dur, T - n.start)*sx - 1);
    g.fillStyle = c; g.strokeStyle = '#2B2340'; g.lineWidth = 1.2;
    g.beginPath(); g.roundRect ? g.roundRect(x, y, ww, nh, 2.5) : g.rect(x, y, ww, nh); g.fill(); g.stroke();
  });
  if (playPos != null){ g.fillStyle = '#2B2340'; g.fillRect(playPos*sx - 1, 0, 2.5, h); }
}

const getPath = (o, k) => k.split('.').reduce((a, b) => a[b], o);
const setPath = (o, k, v) => { const ks = k.split('.'), last = ks.pop(); ks.reduce((a, b) => a[b], o)[last] = v; };
function editP(){
  if (song.custom[curInst]) return song.custom[curInst].p;
  if (!song.tweaks[curInst]) song.tweaks[curInst] = JSON.parse(JSON.stringify(SOUNDS[curInst].p));
  return song.tweaks[curInst];
}
const F = {
  pct: v => Math.round(v*100)+'%', semi: v => (v>0?'+':'')+Math.round(v), cents: v => (v>0?'+':'')+Math.round(v)+'¢',
  sec: v => v < 1 ? Math.round(v*1000)+'ms' : v.toFixed(2)+'s', hz: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : Math.round(v)+'',
  num: v => (+v).toFixed(1), int: v => Math.round(v)+''
};
// [label, key, min, max, step|'log', fmt]
function sl(label, k, min, max, step, fmt){ return {label, k, min, max, step, fmt}; }
function labSlider(P, d){
  const v = d.k.startsWith('song.') ? song[d.k.slice(5)] : getPath(P, d.k);
  let pos = v, attrs;
  if (d.step === 'log'){ pos = Math.round(1000*Math.log(Math.max(d.min, v)/d.min)/Math.log(d.max/d.min)); attrs = `min="0" max="1000" step="1" data-log="1" data-min="${d.min}" data-max="${d.max}"`; }
  else attrs = `min="${d.min}" max="${d.max}" step="${d.step}"`;
  return `<div class="sl"><label>${d.label}</label><input type="range" data-k="${d.k}" data-f="${d.fmt}" ${attrs} value="${pos}"><output>${F[d.fmt](v)}</output></div>`;
}
function choices(P, k, opts){
  const v = k.startsWith('song.') ? song[k.slice(5)] : getPath(P, k);
  return `<div class="chs" data-k="${k}">` + opts.map(([val, lab]) => `<button data-v="${val}" class="${String(val) === String(v) ? 'on' : ''}">${lab}</button>`).join('') + '</div>';

let lastLabUndo = 0;
function labUndo(){ const n = Date.now(); if (n - lastLabUndo > 1200) pushUndo(); lastLabUndo = n; }
$('#lab').addEventListener('pointerdown', e => { if (e.target.matches('input,.chs button')) labUndo(); });
$('#lab').addEventListener('input', e => {
  const inp = e.target; if (!inp.dataset.k) return;
  let v = +inp.value;
  if (inp.dataset.log){ const mn = +inp.dataset.min, mx = +inp.dataset.max; v = mn*Math.pow(mx/mn, v/1000); }
  if (inp.dataset.k.startsWith('song.')) song[inp.dataset.k.slice(5)] = v; else setPath(editP(), inp.dataset.k, v);
  inp.nextElementSibling.textContent = F[inp.dataset.f](v);
  autosave();
});
$('#lab').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const grp = b.closest('.chs');
  if (grp){
    const k = grp.dataset.k; let v = b.dataset.v; if (k === 'lfoSync') v = +v;
    if (k.startsWith('song.')) song[k.slice(5)] = v; else setPath(editP(), k, v);
    if (k === 'lfoSync') renderLab(); else grp.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    autosave(); return;
  }
  const act = b.dataset.act;
  if (act === 'pick') openSoundPicker(curInst, k => { selectInst(k, false); });
  if (act === 'reset'){ pushUndo(); delete song.tweaks[curInst]; renderLab(); autosave(); toast('Back to the original ' + SOUNDS[curInst].name); }
  if (act === 'saveas') saveAsMySound();
  if (act === 'delsound'){
    const k = curInst, C = song.custom[k];
    confirmModal(`Delete your sound “${esc(C.name)}”? Layers using it will switch to ${SOUNDS[C.base] ? SOUNDS[C.base].name : 'Piano'}.`, 'Delete', () => {
      pushUndo(); const base = SOUNDS[C.base] ? C.base : 'piano';
      song.tracks.forEach(t => { if (t.inst === k) t.inst = base; });
      delete song.custom[k]; delete LIB[k]; lsSet(LS_LIB, LIB);
      curInst = base; buildInsts(); renderTracks(); renderLab(); autosave();
    });

});
function saveAsMySound(){
  const I = getInst(curInst), emojis = ['⭐','🚀','🦄','🐙','🍕','🔥','🎈','🐸','🌟','👽','🍩','🦖'];
  openModal(`<h2>⭐ Save as my sound</h2>
    <input class="textIn" id="msName" maxlength="24" placeholder="Name it" value="My ${esc(I.name)}">

  const out = [];
  for (let i = 0; i < L.length; i += 1152){
    const l = L.subarray(i, i+1152), b = R ? enc.encodeBuffer(l, R.subarray(i, i+1152)) : enc.encodeBuffer(l);
    if (b.length) out.push(new Uint8Array(b));
  }
  const f = enc.flush(); if (f.length) out.push(new Uint8Array(f));
  return new Blob(out, {type:'audio/mpeg'});
}

/* ---- capture the real output for audio export ---- */
let capturedAudio = null; // {buffer, webm}
function captureSong(){
  return new Promise((resolve, reject) => {
    initAudio();
    if (!mediaDest || !window.MediaRecorder) return reject(new Error('norec'));
    if (recording) stopRecording();
    stopPlayback();
    const loopSec = songSteps()*stepDur();
    const passes = loopSec >= 20 ? 1 : Math.min(4, Math.max(2, Math.ceil(12/loopSec)));
    const mime = ['audio/webm;codecs=opus','audio/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    let rec; try { rec = new MediaRecorder(mediaDest.stream, mime ? {mimeType:mime, audioBitsPerSecond:256000} : undefined); } catch(e){ return reject(e); }
    const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    exportMode = true;
    rec.onstop = async () => {
      exportMode = false;
      const rtype = (rec.mimeType || 'audio/webm').split(';')[0]; const webm = new Blob(chunks, {type: rtype}); webm._ext = rtype.includes('mp4') ? 'm4a' : 'webm';
      try { const buffer = await ctx.decodeAudioData(await webm.arrayBuffer()); resolve({buffer, webm}); }
      catch(e){ resolve({buffer:null, webm}); }
    };
    rec.start();
    startPlayback(false);
    const total = loopSec*passes, t0 = performance.now();
    const iv = setInterval(() => {
      const left = Math.max(0, Math.ceil(total + 1.5 - (performance.now()-t0)/1000));
      const el = $('#recLeft'); if (el) el.textContent = left + 's';
      if ((performance.now()-t0)/1000 >= total && playing) stopPlayback();
      if ((performance.now()-t0)/1000 >= total + 1.5){ clearInterval(iv); try { rec.stop(); } catch(e){} }
    }, 100);
  });
}

function openExport(){
  const hasSomething = song.tracks.some(t => t.notes.length) || song.rows.some(r => r.steps.some(Boolean));
  if (!hasSomething){ toast('Make some music first!'); return; }
  const zipNote = dlCap ? ' (comes inside a .zip)' : '';
  openModal(`<h2>📤 Export your song</h2>
    <button class="exp" id="exMidi"><span class="ic">🎹</span><span><b>MIDI file (.mid)${zipNote}</b><small>The beat and every layer as separate tracks, notes you can edit in GarageBand, BandLab, Ableton, FL Studio and more.</small></span></button>
    <button class="exp" id="exAudio"><span class="ic">🔊</span><span><b>Audio file: WAV or MP3</b><small>Records exactly what you hear. Plays anywhere and drops into any music app.</small></span></button>
    <button class="exp" id="exJson"><span class="ic">📁</span><span><b>Loop Lab song file (.json)</b><small>Open it back in Loop Lab later to keep working.</small></span></button>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Close</button></div>`);
  $('#exMidi').onclick = () => { stopPlayback(); saveFile(fileBase() + '.mid', new Blob([buildMidi()], {type:'audio/midi'})); };
  $('#exJson').onclick = () => saveFile(fileBase() + '.json', new Blob([snapshot()], {type:'application/json'}));
  $('#exAudio').onclick = async () => {
    openModal(`<h2>🎙️ Recording your song…</h2><p>Listen! This takes about <b id="recLeft">a few seconds</b>.</p>`);
    $('#modal').dataset.lock = '1';
    let res;
    try { res = await captureSong(); }
    catch(e){ delete $('#modal').dataset.lock; closeModal(); toast('This browser can’t record sound'); return; }
    delete $('#modal').dataset.lock;
    capturedAudio = res;
    const url = URL.createObjectURL(res.webm);
    const zipNote2 = dlCap ? '<p class="hint">WAV and MP3 files come inside a .zip here. Open the zip in the Files app to get them.</p>' : '';
    openModal(`<h2>🎧 Your song is ready!</h2>
      <audio controls src="${url}" style="width:100%"></audio>${zipNote2}
      <div class="row" style="margin-top:12px">
        <button class="btn" id="dlWav" style="background:var(--leaf)" ${res.buffer ? '' : 'disabled'}>💾 WAV (best for music apps)</button>
        <button class="btn" id="dlMp3" style="background:var(--sun)" ${res.buffer ? '' : 'disabled'}>💾 MP3 (small, plays anywhere)</button>
        <button class="btn" id="dlWebm">${res.webm._ext === 'm4a' ? 'M4A' : 'WebM'}</button>
        <div class="spacer"></div><button class="btn" data-close>Close</button></div>`);
    $('#dlWav').onclick = () => saveFile(fileBase() + '.wav', toWav(res.buffer));
    $('#dlMp3').onclick = async () => {
      const b = $('#dlMp3'); b.disabled = true; b.textContent = '⏳ Making MP3…';
      try { saveFile(fileBase() + '.mp3', await toMp3(res.buffer)); }
      catch(e){ toast('MP3 needs an internet connection the first time. WAV works offline!'); }
      b.disabled = false; b.textContent = '💾 MP3 (small, plays anywhere)';
    };
    $('#dlWebm').onclick = () => saveFile(fileBase() + '.' + (res.webm._ext || 'webm'), res.webm);
  };
}
$('#exportBtn').onclick = openExport;

/* ================= modal + toast ================= */
function openModal(html){ $('#modalCard').innerHTML = html; $('#modal').classList.remove('hidden'); $$('#modalCard [data-close]').forEach(b => b.onclick = closeModal); }
function closeModal(){ $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal' && !$('#modal').dataset.lock) closeModal(); });
function confirmModal(msg, yes, onYes, onNo){
  openModal(`<p style="font-size:19px;margin-top:0">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cNo">Never mind</button><button class="btn" id="cYes" style="background:var(--coral);color:#fff">${yes}</button></div>`);
  $('#cNo').onclick = () => onNo ? onNo() : closeModal();
  $('#cYes').onclick = () => { closeModal(); onYes(); };
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
